<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lunarist × Eugene Card</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070d;color:#f7f4ff;font:15px/1.5 Inter,system-ui,sans-serif}.card{width:min(520px,calc(100vw - 40px));padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:#111019;text-align:center}.card h1{margin:14px 0 8px;font-size:30px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#c9b6ff;font-weight:800}.muted{color:#9c96ad}.error{color:#ff7d8e}.spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.15);border-top-color:#c9b6ff;border-radius:50%;animation:spin .8s linear infinite;margin:22px auto}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="eyebrow">LUNARIST × EUGENE CARD</div><h1>Preparing secure connection…</h1><div class="spinner"></div><p id="status" class="muted">Checking your Lunarist session.</p></main><script>(async()=>{const q=new URLSearchParams(location.search),status=document.getElementById('status');const keys=['client_id','redirect_uri','response_type','scope','code_challenge','code_challenge_method','state'];const oauth={};for(const k of keys){const v=q.get(k);if(v)oauth[k]=v}try{let session=null;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v.access_token==='string'){session=v;break}}catch{}}if(!session?.access_token){status.className='error';status.textContent='Please sign in to Lunarist first, then start the Eugene Card connection again.';return}const r=await fetch('/oauth/session',{method:'POST',headers:{Authorization:'Bearer '+session.access_token},credentials:'include'});if(!r.ok){status.className='error';status.textContent='Your Lunarist session could not be verified. Please sign in again.';return}const target=new URL('/oauth/authorize',location.origin);Object.entries(oauth).forEach(([k,v])=>target.searchParams.set(k,v));location.replace(target.toString())}catch(e){status.className='error';status.textContent='Unable to start the secure connection. Please try again.'}})();</script></body></html>
