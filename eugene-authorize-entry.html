<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lunarist × Eugene Card</title><style>body{margin:0;min-height:100vh;background:#09070f;color:#f5f1ff;font:15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center}.card{width:min(460px,calc(100vw - 36px));padding:30px;box-sizing:border-box;background:#15121e;border:1px solid #47365a;border-radius:22px;text-align:center}.muted{color:#a8a0b6}</style></head><body><main class="card"><strong>LUNARIST × EUGENE CARD</strong><p class="muted" id="status">Preparing secure connection…</p></main><script>(async function(){const q=new URLSearchParams(location.search);const keys=['client_id','redirect_uri','response_type','scope','code_challenge','code_challenge_method','state'];const params={};for(const k of keys){const v=q.get(k);if(v!==null)params[k]=v}function root(){const u=new URL('/',location.origin);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('oauth_start','1');location.replace(u.toString())}function findAccessToken(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v?.access_token)return v.access_token}catch{}}return''}try{const token=findAccessToken();if(!token){root();return}const r=await fetch('/oauth/session',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},credentials:'include',cache:'no-store'});if(!r.ok){root();return}const u=new URL('/oauth/authorize',location.origin);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));location.replace(u.toString())}catch{root()}})();</script><noscript>Please enable JavaScript to continue.</noscript></body></html>
