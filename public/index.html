<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<meta name="description" content="Lunarist Studio — a living creative network where artists share work and clients discover talent.">
<title>Lunarist Studio — Unleash Your Dream</title>
<style>
:root{--bg:#08070d;--panel:#111019;--panel2:#171522;--line:rgba(255,255,255,.1);--text:#f7f4ff;--muted:#9c96ad;--moon:#c9b6ff;--pink:#ff86c8;--gold:#e8cf91;--green:#8ee0ba;--danger:#ff7d8e;--shadow:0 30px 90px rgba(0,0,0,.42);--radius:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(201,182,255,.1),transparent 30%),radial-gradient(circle at 10% 20%,rgba(255,134,200,.06),transparent 28%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh}.nav{position:sticky;top:0;z-index:50;background:rgba(8,7,13,.74);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.navin{height:72px;max-width:1280px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:26px}.brand{font-weight:900;letter-spacing:.16em;font-size:14px}.brand span{color:var(--moon)}.navlinks{display:flex;gap:8px;margin-left:auto}.navbtn,.iconbtn,.pill{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px}.navbtn:hover,.navbtn.active{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--line)}.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:5px 9px 5px 5px;border-radius:999px}.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2b2541,#111);display:grid;place-items:center;font-size:12px;font-weight:800}.mobile{display:none}.container{max-width:1280px;margin:auto;padding:0 24px}.hero{padding:90px 0 58px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:480px;height:480px;right:-180px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(201,182,255,.18),transparent 65%);pointer-events:none}.eyebrow{font:700 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--moon)}h1{font-size:clamp(48px,8vw,105px);line-height:.9;letter-spacing:-.07em;max-width:900px;margin:18px 0 24px}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--moon)}.hero p{max-width:650px;color:var(--muted);font-size:18px}.heroactions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-1px);border-color:rgba(201,182,255,.4)}.btn.primary{background:var(--text);color:#0a0810;border-color:var(--text)}.btn.pink{background:rgba(255,134,200,.12);color:var(--pink);border-color:rgba(255,134,200,.3)}.section{padding:30px 0 70px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.sectionhead h2{margin:0;font-size:28px;letter-spacing:-.03em}.sectionhead p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-radius:18px;overflow:hidden;transition:.22s;min-width:0}.card:hover{transform:translateY(-4px);border-color:rgba(201,182,255,.35);box-shadow:var(--shadow)}.thumb{aspect-ratio:16/10;background:#050509;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover .thumb img{transform:scale(1.04)}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62));display:flex;align-items:end;padding:12px}.badge{font:700 10px/1 IBM Plex Mono,monospace;border:1px solid rgba(255,255,255,.18);background:rgba(8,7,13,.72);padding:6px 8px;border-radius:999px}.cardbody{padding:14px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;color:#bbb4cb;background:rgba(201,182,255,.07);border:1px solid rgba(201,182,255,.14);padding:4px 7px;border-radius:999px}.row{display:flex;align-items:center;gap:9px}.grow{flex:1}.artist{display:flex;align-items:center;gap:9px}.artist .avatar{width:28px;height:28px}.feature{grid-column:span 2}.feature .thumb{aspect-ratio:16/9}.discoverbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:20px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}.filter.active{color:var(--text);background:rgba(201,182,255,.12);border-color:rgba(201,182,255,.35)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--radius);padding:22px}.artistgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.artistcard{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.artistcard:hover{border-color:rgba(201,182,255,.35)}.artistcard .avatar{width:52px;height:52px;margin-bottom:12px}.artistname{font-weight:800}.role{color:var(--muted);font-size:12px}.search{width:min(420px,100%);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}.search:focus{border-color:rgba(201,182,255,.45)}.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,1,6,.78);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(960px,100%);max-height:92vh;overflow:auto;background:#100e18;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.modalclose{position:absolute;right:18px;top:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;font-size:20px}.modalmedia{aspect-ratio:16/9;background:#000}.modalmedia iframe{width:100%;height:100%;border:0}.modalcontent{padding:24px}.modalcontent h2{font-size:34px;letter-spacing:-.04em;margin:0 0 8px}.modalcontent p{color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}.drawer{position:fixed;inset:0;z-index:90;display:none;background:rgba(0,0,0,.6)}.drawer.open{display:block}.drawerpanel{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);background:#0e0c15;border-left:1px solid var(--line);padding:22px;overflow:auto}.dashhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dashnav{display:flex;gap:6px;overflow:auto;margin-bottom:18px}.dashnav button{white-space:nowrap}.dashsection{display:none}.dashsection.active{display:block}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{border:1px solid var(--line);background:#0a0910;color:var(--text);padding:11px 12px;border-radius:11px;outline:none}.field textarea{min-height:100px;resize:vertical}.listitem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listthumb{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000}.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#f7f4ff;color:#09070d;padding:11px 16px;border-radius:999px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted)}.footer strong{color:var(--text)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.artistgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.navin{height:62px;padding:0 15px}.navlinks{display:none}.mobile{display:block;margin-left:auto}.navlinks.open{display:flex;position:absolute;left:10px;right:10px;top:62px;background:#0d0b13;border:1px solid var(--line);border-radius:15px;padding:8px;flex-direction:column}.hero{padding:62px 0 38px}.container{padding:0 15px}h1{font-size:55px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.feature{grid-column:span 2}.artistgrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.section{padding-bottom:45px}.sectionhead{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="nav"><div class="navin"><button class="brand" data-route="home">LUNARIST <span>✦</span></button><nav class="navlinks" id="navlinks"><button class="navbtn active" data-route="home">Home</button><button class="navbtn" data-route="discover">Discover</button><button class="navbtn" data-route="artists">Artists</button></nav><button class="navbtn mobile" id="menuBtn">Menu</button><button class="userchip" id="accountBtn"><span class="avatar" id="accountAvatar">G</span><span id="accountName">Guest</span></button></div></header>
<main id="view"></main>
<footer class="footer"><div class="container row"><div class="grow"><strong>LUNARIST STUDIO</strong><br><span>Unleash Your Dream.</span></div><span>Creative network · 2026</span></div></footer>
</div>
<div class="modal" id="projectModal"><div class="modalbox"><button class="modalclose" id="modalClose">×</button><div class="modalmedia" id="modalMedia"></div><div class="modalcontent" id="modalContent"></div></div></div>
<div class="drawer" id="drawer"><aside class="drawerpanel"><div class="dashhead"><div><div class="eyebrow">Member space</div><h2 id="dashTitle" style="margin:4px 0">Your Lunarist</h2></div><button class="iconbtn" id="drawerClose">×</button></div><div class="dashnav"><button class="filter active" data-dash="overview">Overview</button><button class="filter" data-dash="projects">My Projects</button><button class="filter" data-dash="profile">Profile</button></div><section class="dashsection active" id="dash-overview"></section><section class="dashsection" id="dash-projects"></section><section class="dashsection" id="dash-profile"></section></aside></div>
<div class="toast" id="toast"></div>
<script>
const demo={
 members:[
  {id:'m1',username:'yujin',name:'Yujin',role:'Motion Designer · Animator',bio:'Turning music, characters and atmosphere into moving stories.',avatar:'https://i.pravatar.cc/160?img=12',skills:['Motion Design','MV','Compositing'],available:true},
  {id:'m2',username:'moffy',name:'Moffy',role:'Illustrator · Character Artist',bio:'Soft worlds, expressive characters and visual development.',avatar:'https://i.pravatar.cc/160?img=32',skills:['Illustration','Character','Concept'],available:true},
  {id:'m3',username:'astra',name:'Astra',role:'Graphic Designer',bio:'Identity, key visuals and sharp graphic systems.',avatar:'https://i.pravatar.cc/160?img=47',skills:['Graphic Design','Branding','PV'],available:false},
  {id:'m4',username:'noctis',name:'Noctis',role:'3D Artist · Compositor',bio:'Cinematic spaces, lighting and post-production.',avatar:'https://i.pravatar.cc/160?img=59',skills:['3D','Compositing','VFX'],available:true}
 ],
 projects:[
  {id:'p1',member:'m1',title:'Stellar Night — MV',category:'MV',tags:['MV','Motion Design','VTuber'],views:1840,likes:142,created:9,video:'https://www.youtube.com/embed/ScMzIvxBSi4',image:'https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg',desc:'A cinematic music video concept built around rhythm, glow and celestial motion.'},
  {id:'p2',member:'m2',title:'Moffy — Character Reel',category:'Illustration',tags:['Illustration','Character'],views:1260,likes:118,created:6,video:'',image:'https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=80',desc:'Character exploration and expressive illustration studies.'},
  {id:'p3',member:'m3',title:'Lunarist Visual Identity',category:'Graphic Design',tags:['Branding','Graphic Design'],views:920,likes:87,created:4,video:'',image:'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=900&q=80',desc:'A visual identity system for a dream-driven creative studio.'},
  {id:'p4',member:'m4',title:'Moonbase — 3D Environment',category:'3D',tags:['3D','VFX'],views:1510,likes:129,created:12,video:'',image:'https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=900&q=80',desc:'A moody 3D environment exploration with cinematic lighting.'},
  {id:'p5',member:'m1',title:'Dream Sequence — PV',category:'PV',tags:['PV','Animation'],views:2100,likes:190,created:21,video:'https://www.youtube.com/embed/aqz-KE-bpKQ',image:'https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg',desc:'Promotional animation designed to introduce a new character world.'},
  {id:'p6',member:'m2',title:'Minstrel Concept Sheet',category:'Illustration',tags:['Illustration','Concept'],views:740,likes:64,created:16,video:'',image:'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=900&q=80',desc:'A concept sheet exploring costume, shape language and mood.'},
  {id:'p7',member:'m3',title:'Neon Signal — Key Visual',category:'Graphic Design',tags:['Graphic Design','PV'],views:1130,likes:102,created:8,video:'',image:'https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=80',desc:'Key visual exploration using contrast, typography and futuristic color.'},
  {id:'p8',member:'m4',title:'Afterglow — Compositing Study',category:'Compositing',tags:['Compositing','VFX'],views:980,likes:91,created:14,video:'',image:'https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=900&q=80',desc:'Post-production study focused on atmosphere, depth and light integration.'}
 ]
};
const state={route:'home',filter:'All',query:'',session:getSession(),currentMember:null,backendReady:false};
function getSession(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('lunarist_session')||'null')}catch(e){}
  if(!s||typeof s!=='object')s={};
  s.id=typeof s.id==='string'&&s.id?s.id:'s_'+(Math.random().toString(36).slice(2));
  s.interests=s.interests&&typeof s.interests==='object'?s.interests:{};
  s.viewed=Array.isArray(s.viewed)?s.viewed:[];
  s.liked=Array.isArray(s.liked)?s.liked:[];
  localStorage.setItem('lunarist_session',JSON.stringify(s));
  return s
}
function saveSession(){localStorage.setItem('lunarist_session',JSON.stringify(state.session))}
function member(id){return demo.members.find(m=>m.id===id)||{id:'unknown',username:'unknown',name:'Unknown artist',role:'',bio:'',avatar:'https://i.pravatar.cc/160?u=unknown',skills:[],available:false}}
function score(p){
  const interests=state.session?.interests&&typeof state.session.interests==='object'?state.session.interests:{};
  const category=String(p?.category||'');
  const tags=Array.isArray(p?.tags)?p.tags:[];
  const interest=Number(interests[category]||0);
  const tagScore=tags.reduce((n,t)=>n+Number(interests[t]||0),0);
  const trend=Math.min(20,Number(p?.views||0)/150);
  const created=Number(p?.created||0);
  const fresh=created>1000000000000?Math.max(0,12-Math.max(0,(Date.now()-created)/86400000)*.45):0;
  const exploration=Math.random()*8;
  return interest*12+tagScore*4+trend+fresh+exploration
}
function personalized(){return [...demo.projects].sort((a,b)=>score(b)-score(a))}
function track(p,type='view'){state.session.interests[p.category]=(state.session.interests[p.category]||0)+(type==='like'?4:1);p.tags.forEach(t=>state.session.interests[t]=(state.session.interests[t]||0)+(type==='like'?.7:.15));if(!state.session.viewed.includes(p.id))state.session.viewed.unshift(p.id);state.session.viewed=state.session.viewed.slice(0,30);saveSession();if(state.backendReady)fetch('/api/lunarist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:{session_id:state.session.id,project_id:p.id,event_type:type,category:p.category,metadata:{tags:p.tags||[]}}})}).catch(()=>{})}
function avatar(m){return `<img class="avatar" src="${m.avatar}" alt="${esc(m.name)}">`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(p,feature=false){const m=member(p.member);return `<article class="card ${feature?'feature':''}" data-project="${p.id}"><div class="thumb"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy"><div class="overlay"><span class="badge">${esc(p.category)}</span></div></div><div class="cardbody"><div class="title">${esc(p.title)}</div><div class="meta artist">${avatar(m)}<span>${esc(m.name)} · ${p.views.toLocaleString()} views</span></div><div class="tags">${p.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function home(){const rec=personalized();const trending=[...demo.projects].sort((a,b)=>b.likes-a.likes);const recent=[...demo.projects].sort((a,b)=>a.created-b.created);return `<div class="container"><section class="hero"><div class="eyebrow">A creative network by Lunarist Studio</div><h1>Unleash<br><em>Your Dream.</em></h1><p>Lunarist is a living portfolio where every artist can publish, every project can be discovered, and every visitor gets a different creative journey.</p><div class="heroactions"><button class="btn primary" data-route="discover">Explore the work</button><button class="btn" data-route="artists">Meet our artists</button></div></section><section class="section"><div class="sectionhead"><div><h2>For you</h2><p>Curated from what you explore.</p></div><span class="eyebrow">Personalized</span></div><div class="grid">${rec.slice(0,5).map((p,i)=>card(p,i===0)).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>Trending this week</h2><p>What the Lunarist community is watching.</p></div><span class="eyebrow">Popular</span></div><div class="grid">${trending.slice(0,4).map(p=>card(p)).join('')}</div></section><section class="section"><div class="split"><div class="panel"><div class="sectionhead"><div><h2>Artists</h2><p>Find the right creative voice.</p></div><button class="btn" data-route="artists">View all</button></div><div class="artistgrid">${demo.members.map(artistCard).join('')}</div></div><div class="panel"><div class="eyebrow">Discovery engine</div><h2 style="font-size:30px;letter-spacing:-.04em">Not everything has to match your taste.</h2><p style="color:var(--muted)">Lunarist mixes relevance with exploration, so your feed can introduce you to artists and disciplines you would not normally click.</p><button class="btn pink" data-action="reset-interest">Reset my feed</button></div></div></section><section class="section"><div class="sectionhead"><div><h2>New arrivals</h2><p>Fresh work from the studio.</p></div></div><div class="grid">${recent.slice(0,4).map(p=>card(p)).join('')}</div></section></div>`}
function artistCard(m){return `<article class="artistcard" data-member="${m.id}">${avatar(m)}<div class="artistname">${esc(m.name)}</div><div class="role">${esc(m.role)}</div><div class="tags">${m.skills.slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div style="margin-top:12px;font-size:11px;color:${m.available?'var(--green)':'var(--muted)'}">${m.available?'● Available':'● Booked'}</div></article>`}
function discover(){let list=demo.projects.filter(p=>state.filter==='All'||p.category===state.filter||p.tags.includes(state.filter));if(state.query){const q=state.query.toLowerCase();list=list.filter(p=>(p.title+' '+p.category+' '+p.tags.join(' ')+' '+member(p.member).name).toLowerCase().includes(q))}list.sort((a,b)=>state.filter==='Recommended'?score(b)-score(a):state.filter==='Trending'?b.likes-a.likes:state.filter==='Newest'?a.created-b.created:score(b)-score(a));const cats=['All','Recommended','Trending','Newest',...new Set(demo.projects.map(p=>p.category))];return `<div class="container"><section class="section" style="padding-top:55px"><div class="sectionhead"><div><div class="eyebrow">Explore Lunarist</div><h2 style="font-size:46px">Discover work.</h2><p>Search projects, styles and artists.</p></div><input class="search" id="searchInput" placeholder="Search projects, artists, skills…" value="${esc(state.query)}"></div><div class="discoverbar">${cats.map(c=>`<button class="filter ${state.filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid" id="discoverGrid">${list.length?list.map(p=>card(p)).join(''):'<div class="empty" style="grid-column:1/-1">No work found. Try another search.</div>'}</div></section></div>`}
function artists(){return `<div class="container"><section class="section" style="padding-top:55px"><div class="eyebrow">The Lunarist collective</div><h2 style="font-size:52px;letter-spacing:-.05em;margin:10px 0">Meet the artists.</h2><p style="color:var(--muted);max-width:650px">Every member owns their profile and projects. Clients can discover people by discipline, style and availability.</p><div class="artistgrid" style="margin-top:28px">${demo.members.map(artistCard).join('')}</div></section></div>`}
function profilePage(m){const ps=demo.projects.filter(p=>p.member===m.id);return `<div class="container"><section class="section" style="padding-top:55px"><button class="btn" data-route="artists">← Artists</button><div class="panel" style="margin-top:16px;padding:30px"><div class="row" style="align-items:flex-start"><img class="avatar" style="width:86px;height:86px" src="${m.avatar}" alt=""><div><div class="eyebrow">@${esc(m.username)}</div><h2 style="font-size:42px;margin:3px 0">${esc(m.name)}</h2><div style="color:var(--muted)">${esc(m.role)}</div><p style="max-width:650px;color:var(--muted)">${esc(m.bio)}</p><div class="tags">${m.skills.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div style="margin-top:14px;color:${m.available?'var(--green)':'var(--muted)'}">${m.available?'● Available for commissions':'● Currently booked'}</div></div></div></div><div class="sectionhead" style="margin-top:38px"><div><h2>Selected work</h2><p>${ps.length} projects</p></div></div><div class="grid">${ps.map(p=>card(p)).join('')}</div></section></div>`}
function render(){document.querySelectorAll('.navbtn[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));let html=state.route==='home'?home():state.route==='discover'?discover():state.route==='artists'?artists():state.route.startsWith('member:')?profilePage(member(state.route.split(':')[1])):home();document.getElementById('view').innerHTML=html;bind();window.scrollTo({top:0,behavior:'instant'})}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;document.getElementById('navlinks').classList.remove('open');render()});document.querySelectorAll('[data-project]').forEach(c=>c.onclick=()=>openProject(c.dataset.project));document.querySelectorAll('[data-member]').forEach(c=>c.onclick=()=>{state.route='member:'+c.dataset.member;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});const s=document.getElementById('searchInput');if(s)s.oninput=e=>{state.query=e.target.value;const q=state.query.toLowerCase();const grid=document.getElementById('discoverGrid');let list=demo.projects.filter(p=>(p.title+' '+p.category+' '+p.tags.join(' ')+' '+member(p.member).name).toLowerCase().includes(q));grid.innerHTML=list.map(p=>card(p)).join('')||'<div class="empty" style="grid-column:1/-1">No work found.</div>';document.querySelectorAll('[data-project]').forEach(c=>c.onclick=()=>openProject(c.dataset.project))};document.querySelector('[data-action="reset-interest"]')?.addEventListener('click',()=>{state.session.interests={};state.session.viewed=[];saveSession();toast('Your discovery profile was reset');render()})}
function openProject(id){const p=demo.projects.find(x=>x.id===id);if(!p)return;track(p);const m=member(p.member);document.getElementById('modalMedia').innerHTML=p.video?`<iframe src="${p.video}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover" alt="">`;document.getElementById('modalContent').innerHTML=`<div class="eyebrow">${esc(p.category)}</div><h2>${esc(p.title)}</h2><div class="artist">${avatar(m)}<button class="btn" data-modal-member="${m.id}">${esc(m.name)} · ${esc(m.role)}</button></div><p>${esc(p.desc)}</p><div class="stats"><span class="stat">👁 ${p.views.toLocaleString()} views</span><button class="stat" id="likeBtn">♡ ${p.likes} like</button><button class="stat" id="saveBtn">🔖 Save</button></div><div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;document.getElementById('projectModal').classList.add('open');document.getElementById('likeBtn').onclick=()=>{p.likes++;track(p,'like');document.getElementById('likeBtn').textContent='♥ '+p.likes+' like';toast('Added to your interests')};document.getElementById('saveBtn').onclick=()=>{toast('Project saved for this session')};document.querySelector('[data-modal-member]').onclick=()=>{closeModal();state.route='member:'+m.id;render()}}
function closeModal(){document.getElementById('projectModal').classList.remove('open');document.getElementById('modalMedia').innerHTML=''}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}
function openDashboard(){const m=state.currentMember||demo.members[0];state.currentMember=m;document.getElementById('accountName').textContent=m.name;document.getElementById('accountAvatar').outerHTML=`<img class="avatar" id="accountAvatar" src="${m.avatar}" alt="">`;document.getElementById('dashTitle').textContent=m.name+' · Member';document.getElementById('dash-overview').innerHTML=`<div class="panel"><div class="eyebrow">Overview</div><h3 style="font-size:26px;margin:5px 0">Welcome back, ${esc(m.name)}.</h3><p style="color:var(--muted)">Your profile is public and your projects can appear in personalized discovery feeds.</p><div class="stats"><span class="stat">${demo.projects.filter(p=>p.member===m.id).length} projects</span><span class="stat">${demo.projects.filter(p=>p.member===m.id).reduce((n,p)=>n+p.views,0).toLocaleString()} views</span></div></div><div class="panel" style="margin-top:12px"><div class="eyebrow">Discovery</div><p style="color:var(--muted)">Current visitor interests are learned from project views, likes and category exploration. Production mode should store these events in Supabase.</p></div>`;const ps=demo.projects.filter(p=>p.member===m.id);document.getElementById('dash-projects').innerHTML=`<div class="panel"><div class="row"><div class="grow"><div class="eyebrow">My projects</div><h3 style="margin:4px 0">Published work</h3></div><button class="btn primary" id="addDemoProject">+ Add project</button></div>${ps.map(p=>`<div class="listitem"><img class="listthumb" src="${p.image}"><div class="grow"><b>${esc(p.title)}</b><div class="meta">${esc(p.category)} · ${p.views} views</div></div></div>`).join('')}</div>`;document.getElementById('dash-profile').innerHTML=`<div class="panel"><div class="eyebrow">Edit profile</div><div class="formgrid"><div class="field"><label>Display name</label><input id="pfName" value="${esc(m.name)}"></div><div class="field"><label>Username</label><input value="@${esc(m.username)}" disabled></div><div class="field full"><label>Role</label><input id="pfRole" value="${esc(m.role)}"></div><div class="field full"><label>Bio</label><textarea id="pfBio">${esc(m.bio)}</textarea></div><div class="field"><label>Availability</label><select id="pfAvail"><option value="1" ${m.available?'selected':''}>Available</option><option value="0" ${!m.available?'selected':''}>Booked</option></select></div></div><button class="btn primary" style="margin-top:14px" id="saveProfile">Save profile</button></div>`;document.getElementById('drawer').classList.add('open');document.querySelectorAll('[data-dash]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dash]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.dashsection').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('dash-'+b.dataset.dash).classList.add('active')});document.getElementById('saveProfile').onclick=()=>{m.name=document.getElementById('pfName').value;m.role=document.getElementById('pfRole').value;m.bio=document.getElementById('pfBio').value;m.available=document.getElementById('pfAvail').value==='1';toast('Profile saved');openDashboard()};document.getElementById('addDemoProject').onclick=()=>toast('Project uploader is ready for Supabase integration')}
function closeDash(){document.getElementById('drawer').classList.remove('open')}
document.getElementById('accountBtn').onclick=()=>openDashboard();document.getElementById('modalClose').onclick=closeModal;document.getElementById('projectModal').onclick=e=>{if(e.target.id==='projectModal')closeModal()};document.getElementById('drawerClose').onclick=closeDash;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDash()};document.getElementById('menuBtn').onclick=()=>document.getElementById('navlinks').classList.toggle('open');
async function loadSupabase(){try{const [pr,pp]=await Promise.all([fetch('/api/lunarist?resource=profiles&select=id,username,display_name,role,bio,avatar_url,skills,available&order=created_at').then(r=>r.ok?r.json():Promise.reject()),fetch('/api/lunarist?resource=projects&select=id,owner_id,title,description,category,tags,thumbnail_url,media_url,media_type,published,views,likes,created_at&published=eq.true&order=created_at.desc').then(r=>r.ok?r.json():Promise.reject())]);if(Array.isArray(pr)&&pr.length){demo.members=pr.map(x=>({id:x.id,username:x.username,name:x.display_name,role:x.role||'',bio:x.bio||'',avatar:x.avatar_url||'https://i.pravatar.cc/160?u='+x.id,skills:x.skills||[],available:x.available!==false}));}if(Array.isArray(pp)&&pp.length){demo.projects=pp.map(x=>({id:x.id,member:x.owner_id,title:x.title,category:x.category,tags:x.tags||[],views:Number(x.views||0),likes:Number(x.likes||0),created:Date.parse(x.created_at||0)||0,video:x.media_type==='video'?x.media_url:'',image:x.thumbnail_url||x.media_url||'',desc:x.description||''}));}state.backendReady=true;}catch(e){console.warn('Supabase unavailable; using local demo data.',e)}}
loadSupabase().finally(render);
</script>
</body>
</html>
