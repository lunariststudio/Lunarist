<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Projects — Lunarist Studio</title><style>body{margin:0;background:#08070d;color:#f7f4ff;font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.brand{font-weight:900;letter-spacing:.14em}.btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer}.btn:hover{border-color:#c9b6ff}.muted{color:#9c96ad}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);border-radius:18px;overflow:hidden}.thumb{aspect-ratio:16/10;background:#111}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:14px}.title{font-weight:800}.meta{font-size:12px;color:#9c96ad;margin-top:5px}.empty{padding:60px 20px;border:1px dashed rgba(255,255,255,.12);border-radius:18px;text-align:center;color:#9c96ad}.danger{color:#ff7d8e}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">LUNARIST ✦</div><h1 style="margin:12px 0 4px">Saved projects.</h1><div class="muted" id="subtitle">Your wishlist, synced to your Lunarist account.</div></div><div><button class="btn" onclick="location.href='/'">← Back to Lunarist</button></div></div><div id="app"><div class="empty">Loading your saved projects…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function main(){const app=document.getElementById('app');try{const c=await (await fetch('/api/config')).json();if(!c.url||!c.anonKey)throw Error('Lunarist configuration is missing.');sb=window.supabase.createClient(c.url,c.anonKey);const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="empty"><h2 style="color:#f7f4ff">Sign in to see your Saved projects</h2><p>Saved projects are synced to your account so they follow you across devices.</p><button class="btn" onclick="location.href='+'\'/\''+">Open Lunarist &amp; Sign in</button></div>';return}const {data:rows,error}=await sb.from('saved_projects').select('project_id,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});if(error)throw error;const ids=(rows||[]).map(x=>x.project_id);if(!ids.length){app.innerHTML='<div class="empty"><h2 style="color:#f7f4ff">Nothing saved yet.</h2><p>Save a project from Lunarist and it will appear here.</p><button class="btn" onclick="location.href='/'">Discover projects</button></div>';return}const {data:projects,error:pe}=await sb.from('projects').select('id,title,thumbnail_url,views,likes,category,owner_id').in('id',ids);if(pe)throw pe;const byId=new Map((projects||[]).map(p=>[p.id,p]));const ordered=ids.map(id=>byId.get(id)).filter(Boolean);document.getElementById('subtitle').textContent=ordered.length+' saved project'+(ordered.length===1?'':'s');app.innerHTML='<div class="grid">'+ordered.map(p=>'<article class="card"><div class="thumb"><img src="'+esc(p.thumbnail_url||'')+'" alt="" onerror="this.style.display=\'none\'"></div><div class="body"><div class="title">'+esc(p.title||'Untitled project')+'</div><div class="meta">'+esc(p.category||'Project')+' · '+Number(p.likes||0).toLocaleString()+' likes · '+Number(p.views||0).toLocaleString()+' views</div><div style="margin-top:12px"><button class="btn" onclick="location.href='+'\'/#project-'+encodeURIComponent(p.id)+'\''+">Open project</button></div></div></article>').join('')+'</div>'}catch(e){console.error(e);app.innerHTML='<div class="empty"><div class="danger">Could not load Saved projects.</div><p>'+esc(e.message||'Please try again.')+'</p><button class="btn" onclick="location.reload()">Retry</button></div>'}}main();</script></body></html>
