<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunarist Studio</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(255, 255, 255, 0.02);
      --border: #27272a;
      --input-bg: #18181b;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #6366f1;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .eyebrow {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: span 2;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-group {
      grid-column: span 2;
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    button.primary {
      background: var(--text);
      color: var(--bg);
    }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    #serviceMsg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="serviceFormContainer"></div>

<script>
const data = {
  services: [
    { id: '1', category: 'Motion Design' },
    { id: '2', category: '3D Modeling' }
  ]
};

function esc(str) {
  return String(str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderServiceForm(existing = null) {
  const container = document.getElementById('serviceFormContainer');
  
  container.innerHTML = `
    <div class="panel">
      <div class="eyebrow">${existing ? 'Edit' : 'New'} service</div>
      <div class="formgrid">
        
        <div class="field full">
          <label>Title</label>
          <input id="svTitle" value="${esc(existing?.title || '')}" placeholder="Motion design package">
        </div>

        <div class="field">
          <label>Category</label>
          <select id="svCategorySelect"></select>
          <input id="svCategoryNew" placeholder="Enter new category..." style="display:none; margin-top: 6px;">
        </div>

        <div class="field">
          <label>Tags</label>
          <input id="svTags" value="${esc((existing?.tags || []).join(', '))}" placeholder="motion, branding">
        </div>

        <div class="field full">
          <label>Description</label>
          <textarea id="svDesc" placeholder="Describe what you offer...">${esc(existing?.description || '')}</textarea>
        </div>

        <div class="field">
          <label>Starting price</label>
          <input id="svPrice" value="${esc(existing?.price_from || '')}" placeholder="$300">
        </div>

        <div class="field">
          <label>Delivery time</label>
          <input id="svDelivery" value="${esc(existing?.delivery_time || '')}" placeholder="5–7 days">
        </div>

        <div class="field full">
          <label>Thumbnail URL</label>
          <input id="svThumb" value="${esc(existing?.thumbnail_url || '')}" placeholder="https://…">
        </div>

        <div class="field">
          <label>Thumbnail upload</label>
          <input id="svThumbFile" type="file" accept="image/*">
        </div>

        <div class="field">
          <label>Status</label>
          <select id="svStatus">
            <option value="draft" ${(!existing?.status || existing?.status === 'draft') ? 'selected' : ''}>Draft</option>
            <option value="pending" ${existing?.status === 'pending' ? 'selected' : ''}>Submit for review</option>
            <option value="published" ${(existing?.status === 'published' || existing?.published) ? 'selected' : ''}>Published</option>
            <option value="archived" ${existing?.status === 'archived' ? 'selected' : ''}>Archived</option>
          </select>
        </div>

        <div class="btn-group">
          <button id="saveService" class="primary">${existing ? 'Update' : 'Create'} service</button>
          <button id="cancelService" class="secondary">Cancel</button>
        </div>

        <div id="serviceMsg" class="field full"></div>
      </div>
    </div>
  `;

  // --- Category Dropdown Setup ---
  const defaultCategories = ['Motion Design', '3D Modeling', 'Branding', 'UI/UX Design', 'Illustration', 'Video Editing'];
  const existingCategories = Array.from(new Set([
    ...defaultCategories,
    ...(data.services || []).map(s => s.category).filter(Boolean),
    ...(existing?.category ? [existing.category] : [])
  ])).sort();

  const catSelect = document.getElementById('svCategorySelect');
  const catNewInput = document.getElementById('svCategoryNew');

  catSelect.innerHTML = existingCategories.map(c => 
    `<option value="${esc(c)}" ${existing?.category === c ? 'selected' : ''}>${esc(c)}</option>`
  ).join('') + `<option value="__NEW__">+ Add new category...</option>`;

  if (existing?.category && !existingCategories.includes(existing.category)) {
    catSelect.value = '__NEW__';
    catNewInput.style.display = 'block';
    catNewInput.value = existing.category;
  }

  catSelect.onchange = () => {
    if (catSelect.value === '__NEW__') {
      catNewInput.style.display = 'block';
      catNewInput.focus();
    } else {
      catNewInput.style.display = 'none';
    }
  };

  // --- Save Action ---
  document.getElementById('saveService').onclick = async () => {
    const title = document.getElementById('svTitle').value.trim();
    const categorySelectVal = catSelect.value;
    const categoryNewVal = catNewInput.value.trim();

    const category = categorySelectVal === '__NEW__' ? categoryNewVal : categorySelectVal;
    const tags = document.getElementById('svTags').value.split(',').map(x => x.trim()).filter(Boolean).slice(0, 12);
    const status = document.getElementById('svStatus').value;

    if (!title || !category) {
      document.getElementById('serviceMsg').textContent = 'Title and category are required.';
      return;
    }

    document.getElementById('serviceMsg').style.color = '#10b981';
    document.getElementById('serviceMsg').textContent = 'Service saved successfully!';
  };

  document.getElementById('cancelService').onclick = () => {
    container.innerHTML = '';
  };
}

renderServiceForm();
</script>

</body>
</html>
