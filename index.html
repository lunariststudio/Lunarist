function formatViews(n){

function pathForRoute(route){if(route==='home')return '/';if(route==='discover')return '/discover';if(route==='artists')return '/artists';if(route==='services')return '/services';if(route==='admin')return '/admin';if(route.startsWith('member:')){const m=member(route.split(':')[1]);return m?.username?('/'+m.username):'/artists'}return '/'}

function extractYoutubeId(url){
  if(!url) return null;
  const s = String(url).trim();
  let m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return null;
}

async function uploadProjectFile(file,kind){if(!file)return null;const ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=`${state.currentUser.id}/${crypto.randomUUID()}-${kind}.${ext}`;const up=await supabaseClient.storage.from('project-media').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;const pub=supabaseClient.storage.from('project-media').getPublicUrl(path);return pub.data.publicUrl}
function score(p){
  const interests=state.session.interests||{};
  const category=String(p?.category||'');
  const tags=Array.isArray(p?.tags)?p.tags:[];
  const interestRaw=Number(interests[category]||0);
  const tagRaw=tags.reduce((n,t)=>n+Number(interests[t]||0),0);
  return Math.min(100,(Math.min(1,(interestRaw/10)+(tagRaw/40))*40)+(Math.min(1,tagRaw/20)*20)+(Math.min(1,Number(p?.views||0)/5000)*15)+(Math.max(0,1-(Math.max(0,(Date.now()-(Date.parse(p?.created_at||'')||Date.now())))/86400000)/180)*10)+(p?.member&&state.session.viewed.includes(p.member)?8:2)+5);
}

  const ranked=(data.recommendations||[]).map(r=>data.projects.find(p=>p.id===r.project_id)).filter(Boolean);

}

async function authSubmit(){
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,username=document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,32),display=document.getElementById('authDisplay').value.trim();
  if(!email||!password||(state.authMode==='signup'&&!username)){document.getElementById('authMessage').textContent='Please complete the required fields.';return}
  document.getElementById('authSubmit').disabled=true;
  try{
    if(state.authMode==='signup'){
      const {data:d,error}=await supabaseClient.auth.signUp({email,password,options:{data:{username,display_name:display||username}}});
      if(error)throw error;
      document.getElementById('authMessage').textContent=d.session?'Account created.':'Check your email to confirm your account.';
      if(d.session){closeAuth();await refreshUser();openDashboard()}
    }else{
      const {error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      closeAuth();await refreshUser();openDashboard()
    }
  }catch(e){document.getElementById('authMessage').textContent=e.message||'Authentication failed.'}
  finally{document.getElementById('authSubmit').disabled=false}
}

  document.getElementById('googleAuth').disabled=true;
  try{const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/'}});if(error)throw error}
  catch(e){document.getElementById('authMessage').textContent=e.message||'Google sign-in failed.';document.getElementById('googleAuth').disabled=false}
}

async function resetPassword(){
  const email=document.getElementById('authEmail').value.trim();
  if(!email){document.getElementById('authMessage').textContent='Enter your email first.';return}
  document.getElementById('forgotPassword').disabled=true;
  try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/?reset=1'});if(error)throw error;document.getElementById('authMessage').textContent='Password reset email sent. Check your inbox.'}
  catch(e){document.getElementById('authMessage').textContent=e.message||'Unable to send reset email.'}
  finally{document.getElementById('forgotPassword').disabled=false}
}

async function refreshUser(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  state.currentUser=session?.user||null;
  if(state.currentUser){
    let {data:p}=await supabaseClient.from('profiles').select('id,username,display_name,role,bio,avatar_url,skills,available,is_admin,account_type,tos,theme').eq('id',state.currentUser.id).maybeSingle();
    if(!p){
      const fallback={id:state.currentUser.id,username:(state.currentUser.email||'member').split('@')[0].replace(/[^a-z0-9_]/gi,'').slice(0,32)||'member',display_name:state.currentUser.email||'Lunarist member',role:'',bio:'',skills:[],available:true,account_type:'user',theme:'moonlight'};
      const r=await supabaseClient.from('profiles').insert(fallback).select().single();
      if(!r.error)p=r.data;
    }
    const isStudioAdmin = !!p?.is_admin || state.currentUser?.email === 'lunariststudio@gmail.com';
    state.currentMember=p?{
      id:p.id,
      username:p.username,
      name:p.display_name,
      role:p.role||'',
      bio:p.bio||'',
      tos:p.tos||'',
      theme:p.theme||'moonlight',
      avatar:p.avatar_url||'https://i.pravatar.cc/160?u='+p.id,
      skills:p.skills||[],
      available:p.available!==false,
      is_admin:isStudioAdmin,
      account_type:isStudioAdmin?'member':(p.account_type||'user')
    }:null;
    state.selectedTheme = state.currentMember?.theme || 'moonlight';
    applyTheme(state.selectedTheme);
    document.getElementById('accountName').textContent=state.currentMember?.name||'Member';
    document.getElementById('accountAvatar').outerHTML=`<img class="avatar" id="accountAvatar" src="${esc(state.currentMember?.avatar||'')}" alt="" onerror="handleImageError(this)">`;
  }else{
    const navAdmin = document.getElementById('navAdminBtn');
    if(navAdmin) navAdmin.style.display='none';
    document.getElementById('accountName').textContent='Guest';
    document.getElementById('accountAvatar').outerHTML='<span class="avatar" id="accountAvatar">G</span>';
    state.currentMember=null;
    applyTheme('moonlight');
  }
}

function openDashboard(){
  if(!state.currentUser){openAuth('signin');return}
  document.getElementById('drawer').classList.add('open');
}

function closeDash(){document.getElementById('drawer').classList.remove('open')}

async function loadConfig(){
  const r=await fetch('/api/config');
  if(!r.ok)throw new Error('Lunarist configuration missing.');
  const c=await r.json();
  if(!c.url||!c.anonKey)throw new Error('SUPABASE_URL and SUPABASE_ANON_KEY are required.');
  supabaseClient=window.supabase.createClient(c.url,c.anonKey);
  supabaseClient.auth.onAuthStateChange(async()=>{await refreshUser();updateAccountButton()});
  await refreshUser();
}

async function loadData(){
  state.loadError=null;
  try{
    if(!supabaseClient)await loadConfig();
    const [pr,pp,sv]=await Promise.all([
      fetch('/api/lunarist?resource=profiles').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()}),
      fetch('/api/lunarist?resource=projects').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()}),
      fetch('/api/lunarist?resource=services').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()})
    ]);
    data.members=(Array.isArray(pr)?pr:[]).map(x=>({
      id:x.id,
      username:x.username,
      name:x.display_name,
      role:x.role||'',
      bio:x.bio||'',
      tos:x.tos||'',
      theme:x.theme||'moonlight',
      avatar:x.avatar_url||'https://i.pravatar.cc/160?u='+x.id,
      skills:x.skills||[],
      available:x.available!==false,
      account_type:x.account_type||'member',
      is_admin:!!x.is_admin
    }));
    
    data.projects=(Array.isArray(pp)?pp:[]).map(x=>({
      id:x.id,
      member:x.owner_id||x.artist_id,
      title:x.title,
      category:x.category,
      tags:x.tags||[],
      views:Number(x.views||0),
      likes:Number(x.likes||0),
      created_at:x.created_at,
      position:x.position,
      video:x.media_type==='video'?x.media_url:'',
      image:x.thumbnail_url||x.media_url||'',
      desc:x.description||'',
      description:x.description||'',
      published:x.published,
      status:x.status||(x.published?'published':'draft'),
      featured:!!x.featured,
      thumbnail_url:x.thumbnail_url,
      media_url:x.media_url,
      media_type:x.media_type
    }));

    data.services=(Array.isArray(sv)?sv:[]).map(x=>({id:x.id,member:x.owner_id||x.artist_id,title:x.title,category:x.category,tags:x.tags||[],price_from:x.price_from||'',delivery_time:x.delivery_time||'',thumbnail_url:x.thumbnail_url||'',views:Number(x.views||0),created_at:x.created_at,description:x.description||'',add_ons:x.add_ons||[],projectIds:(x.service_projects||[]).map(sp=>sp.project_id)}));
    
    state.backendReady=true;
    if(!state.routeInitialized){state.route=routeFromPath();state.routeInitialized=true}
    render();
  }catch(e){
    state.backendReady=false;
    state.loadError=e.message||'Unable to connect to Supabase.';
    render()
  }
}

function updateAccountButton(){
  const b=document.getElementById('accountBtn');
  const isAdmin = state.currentMember?.is_admin;
  const navAdmin = document.getElementById('navAdminBtn');
  if(navAdmin) navAdmin.style.display = isAdmin ? 'inline-flex' : 'none';
  if(state.currentUser){
    b.title='Open member space · '+roleLabel(state.currentMember);
    document.getElementById('accountName').textContent=state.currentMember?.name||state.currentUser.email||'Member';
  }else{
    b.title='Sign in';
    document.getElementById('accountName').textContent='Guest';
  }
}

document.getElementById('accountBtn').onclick=()=>state.currentUser?openDashboard():openAuth('signin');
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('projectModal').onclick=e=>{if(e.target.id==='projectModal')closeModal()};
document.getElementById('drawerClose').onclick=closeDash;
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDash()};
document.getElementById('menuBtn').onclick=()=>document.getElementById('navlinks').classList.toggle('open');
document.getElementById('authClose').onclick=closeAuth;
document.getElementById('authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth()};
document.getElementById('authSubmit').onclick=authSubmit;
document.getElementById('authToggle').onclick=()=>openAuth(state.authMode==='signin'?'signup':'signin');
document.getElementById('googleAuth').onclick=signInWithGoogle;
document.getElementById('forgotPassword').onclick=resetPassword;

(async()=>{await loadData();updateAccountButton()})();
</script>
</body>
</html>
