<style>
:root{--bg:#08070d;--panel:#111019;--panel2:#171522;--line:rgba(255,255,255,.1);--text:#f7f4ff;--muted:#9c96ad;--moon:#c9b6ff;--pink:#ff86c8;--gold:#e8cf91;--green:#8ee0ba;--danger:#ff7d8e;--shadow:0 30px 90px rgba(0,0,0,.42);--radius:22px}*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:hidden}body{margin:0;overflow-x:hidden;background:radial-gradient(circle at 80% 0%,rgba(201,182,255,.1),transparent 30%),radial-gradient(circle at 10% 20%,rgba(255,134,200,.06),transparent 28%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;transition:background .3s,color .3s}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh}.nav{position:sticky;top:0;z-index:50;background:rgba(8,7,13,.74);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.navin{height:72px;max-width:1280px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:26px}.brand{font-weight:900;letter-spacing:.16em;font-size:14px}.brand span{color:var(--moon)}.navlinks{display:flex;gap:8px;margin-left:auto}.navbtn,.iconbtn,.pill{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px}.navbtn:hover,.navbtn.active{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--line)}.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:5px 9px 5px 5px;border-radius:999px}.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2b2541,#111);display:grid;place-items:center;font-size:12px;font-weight:800}.mobile{display:none}.container{max-width:1280px;margin:auto;padding:0 24px}.hero{padding:90px 0 58px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:480px;height:480px;right:-180px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(201,182,255,.18),transparent 65%);pointer-events:none}.eyebrow{font:700 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--moon)}h1{font-size:clamp(48px,8vw,105px);line-height:.9;letter-spacing:-.07em;max-width:900px;margin:18px 0 24px}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--moon)}.hero p{max-width:650px;color:var(--muted);font-size:18px}.heroactions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-1px);border-color:var(--moon)}.btn.primary{background:var(--text);color:#0a0810;border-color:var(--text)}.btn.pink{background:rgba(255,134,200,.12);color:var(--pink);border-color:rgba(255,134,200,.3)}.section{padding:30px 0 70px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.sectionhead h2{margin:0;font-size:28px;letter-spacing:-.03em}.sectionhead p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-radius:18px;overflow:hidden;transition:.22s;min-width:0}.card:hover{transform:translateY(-4px);border-color:var(--moon);box-shadow:var(--shadow)}.thumb{aspect-ratio:16/10;background:#050509;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover .thumb img{transform:scale(1.04)}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62));display:flex;align-items:end;padding:12px}.badge{font:700 10px/1 IBM Plex Mono,monospace;border:1px solid rgba(255,255,255,.18);background:rgba(8,7,13,.72);padding:6px 8px;border-radius:999px}.cardbody{padding:14px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;color:var(--moon);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:4px 7px;border-radius:999px}.row{display:flex;align-items:center;gap:9px}.grow{flex:1}.artist{display:flex;align-items:center;gap:9px}.artist .avatar{width:28px;height:28px}.feature{grid-column:span 2}.feature .thumb{aspect-ratio:16/9}.discoverbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:20px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}.filter.active{color:var(--text);background:rgba(255,255,255,.12);border-color:var(--moon)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--radius);padding:22px}.artistgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.artistcard{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.artistcard:hover{border-color:var(--moon)}.artistcard .avatar{width:52px;height:52px;margin-bottom:12px}.artistname{font-weight:800}.role{color:var(--muted);font-size:12px}.search{width:min(420px,100%);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}.search:focus{border-color:var(--moon)}.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,1,6,.78);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(960px,100%);max-height:92vh;overflow:auto;background:#100e18;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.modalclose{position:absolute;right:18px;top:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;font-size:20px}.modalmedia{aspect-ratio:16/9;background:#000}.modalmedia iframe{width:100%;height:100%;border:0}.modalcontent{padding:24px}.modalcontent h2{font-size:34px;letter-spacing:-.04em;margin:0 0 8px}.modalcontent p{color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}.drawer{position:fixed;inset:0;z-index:90;display:none;background:rgba(0,0,0,.6)}.drawer.open{display:block}.drawerpanel{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);max-width:100vw;background:#0e0c15;border-left:1px solid var(--line);padding:22px;overflow-x:hidden;overflow-y:auto}.dashhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dashnav{display:flex;gap:6px;overflow:auto;margin-bottom:18px}.dashnav button{white-space:nowrap}.dashsection{display:none}.dashsection.active{display:block}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;max-width:100%;border:1px solid var(--line);background:#0a0910;color:var(--text);padding:11px 12px;border-radius:11px;outline:none}.field input[type=file]{padding:9px 6px;font-size:12px}.field textarea{min-height:100px;resize:vertical}.listitem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listthumb{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000}.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#f7f4ff;color:#09070d;padding:11px 16px;border-radius:999px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted)}.footer strong{color:var(--text)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.artistgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.navin{height:62px;padding:0 15px}.navlinks{display:none}.mobile{display:block;margin-left:auto}.navlinks.open{display:flex;position:absolute;left:10px;right:10px;top:62px;background:#0d0b13;border:1px solid var(--line);border-radius:15px;padding:8px;flex-direction:column}.hero{padding:62px 0 38px}.container{padding:0 15px}h1{font-size:55px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.feature{grid-column:span 2}.artistgrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.section{padding-bottom:45px}.sectionhead{align-items:flex-start;flex-direction:column}.search{width:100%}}
.bullet-item{display:flex;align-items:flex-start;gap:10px;margin-top:6px;margin-bottom:6px}.bullet-dot{color:var(--moon);font-size:22px;line-height:1;user-select:none}
.addon-box{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;margin-top:6px}
.addon-box label{font-size:13px;text-transform:none;letter-spacing:normal;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}
.tos-box{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02);max-height:300px;overflow-y:auto;font-size:13px;color:var(--muted);line-height:1.6}

/* Theme Color Selector Grid */
.theme-picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.theme-option{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.2s}
.theme-option:hover,.theme-option.selected{border-color:var(--moon);background:rgba(255,255,255,.06)}
.theme-swatches{display:flex;gap:6px;align-items:center}
.theme-swatch{width:16px;height:16px;border-radius:50%}

/* Drag and drop item styling */
.listitem.draggable{cursor:grab;user-select:none;transition:background 0.15s, opacity 0.15s;align-items:center}
.listitem.draggable:active{cursor:grabbing}
.listitem.dragging{opacity:0.35;background:rgba(255,255,255,0.08);border-radius:12px}
.drag-handle{display:flex;align-items:center;padding:0 8px 0 2px;color:var(--muted);font-size:18px;cursor:grab}
.drag-handle:hover{color:var(--moon)}

/* Portfolio Checkbox Thumbnail Grid */
.portfolio-check-item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.portfolio-check-item:hover{border-color:var(--moon)}
.portfolio-check-thumb{width:48px;height:32px;border-radius:6px;object-fit:cover;background:#000}

/* Global Theme Definitions Override */
html[data-theme="moonlight"]{--moon:#c9b6ff;--pink:#ff86c8;--line:rgba(201,182,255,.22);--bg:#08070d}
html[data-theme="cyberpink"]{--moon:#ff86c8;--pink:#ff4da6;--line:rgba(255,134,200,.28);--bg:#0e0612}
html[data-theme="goldember"]{--moon:#e8cf91;--pink:#ff9e42;--line:rgba(232,207,145,.28);--bg:#0f0d08}
html[data-theme="emeraldglow"]{--moon:#8ee0ba;--pink:#51c4a0;--line:rgba(142,224,186,.28);--bg:#060f0b}
html[data-theme="midnight"]{--moon:#8bb2ff;--pink:#a28eff;--line:rgba(139,178,255,.28);--bg:#060912}
</style>

<body>
<div class="app" id="app">
<header class="nav"><div class="navin"><button class="brand" data-route="home">LUNARIST <span>✦</span></button><nav class="navlinks" id="navlinks"><button class="navbtn active" data-route="home">Home</button><button class="navbtn" data-route="discover">Discover</button><button class="navbtn" data-route="services">Services</button><button class="navbtn" data-route="artists">Artists</button><button class="navbtn" data-route="admin" id="navAdminBtn" style="display:none">Admin Studio</button></nav><button class="navbtn mobile" id="menuBtn">Menu</button><button class="userchip" id="accountBtn"><span class="avatar" id="accountAvatar">G</span><span id="accountName">Guest</span></button></div></header>
<main id="view"></main>
<footer class="footer"><div class="container row"><div class="grow"><strong>LUNARIST STUDIO</strong><br><span>Unleash Your Dream.</span></div><span>Creative network · 2026</span></div></footer>
</div>
<div class="modal" id="projectModal"><div class="modalbox"><button class="modalclose" id="modalClose">×</button><div class="modalmedia" id="modalMedia"></div><div class="modalcontent" id="modalContent"></div></div></div>
<div class="drawer" id="drawer"><aside class="drawerpanel"><div class="dashhead"><div><div class="eyebrow">Member space</div><h2 id="dashTitle" style="margin:4px 0">Your Lunarist</h2></div><button class="iconbtn" id="drawerClose">×</button></div><div class="dashnav"><button class="filter active" data-dash="overview">Overview</button><button class="filter" data-dash="projects">My Projects</button><button class="filter" data-dash="profile">Profile</button><button class="filter" data-dash="services">Services</button></div><section class="dashsection active" id="dash-overview"></section><section class="dashsection" id="dash-projects"></section><section class="dashsection" id="dash-services"></section><section class="dashsection" id="dash-profile"></section></aside></div>
<div class="toast" id="toast"></div>
<div class="modal" id="authModal"><div class="modalbox" style="max-width:520px;padding:26px"><button class="modalclose" id="authClose">×</button><div class="eyebrow">Lunarist account</div><h2 id="authTitle" style="font-size:34px;margin:6px 0 8px">Sign in</h2><p id="authSubtitle" style="color:var(--muted)">Save work, publish projects and manage your creative profile.</p><div class="formgrid" style="margin-top:18px"><div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field full"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="field full" id="authUsernameWrap" style="display:none"><label>Username</label><input id="authUsername" autocomplete="username" placeholder="yourname"></div><div class="field full" id="authDisplayWrap" style="display:none"><label>Display name</label><input id="authDisplay" placeholder="Your name"></div></div><div class="heroactions" style="margin-top:18px"><button class="btn primary" id="authSubmit">Sign in</button><button class="btn" id="authToggle">Create account</button></div><div style="margin-top:10px"><button class="btn" id="googleAuth" style="width:100%">Continue with Google</button></div><div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn" id="forgotPassword" style="padding:0;background:none;border:0">Forgot password?</button><span id="authModeHint" class="meta"></span></div><p id="authMessage" style="min-height:20px;margin:12px 0 0;color:var(--muted)"></p></div></div>
<script>
let supabaseClient=null;
const state={route:'home',filter:'All',query:'',session:{id:'s_'+Math.random().toString(36).slice(2),interests:{},viewed:[],liked:[]},currentUser:null,currentMember:null,selectedTheme:'moonlight',backendReady:false,authMode:'signin',loadError:null};
const data={members:[],projects:[],services:[],recommendations:[]};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDescription(text){if(!text)return '';const escaped=esc(text);const formatted=escaped.replace(/(?:^|\n)[-*\u2022]\s+(.+)/g,'<div class="bullet-item"><span class="bullet-dot">•</span><span>$1</span></div>');return formatted.replace(/\n/g,'<br>')}
function formatViews(n){
  n=Number(n||0);
  if(n>=1000000)return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1000)return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
  return n.toLocaleString();
}
function applyTheme(themeName){
  state.selectedTheme = themeName || 'moonlight';
  document.documentElement.setAttribute('data-theme', state.selectedTheme);
}
function getSession(){let s=null;try{s=JSON.parse(localStorage.getItem('lunarist_session')||'null')}catch(e){}if(!s||typeof s!=='object')s={};s.id=typeof s.id==='string'&&s.id?s.id:'s_'+Math.random().toString(36).slice(2);s.interests=s.interests&&typeof s.interests==='object'?s.interests:{};s.viewed=Array.isArray(s.viewed)?s.viewed:[];s.liked=Array.isArray(s.liked)?s.liked:[];localStorage.setItem('lunarist_session',JSON.stringify(s));return s}
state.session=getSession();
function saveSession(){localStorage.setItem('lunarist_session',JSON.stringify(state.session))}
function member(id){return data.members.find(m=>m.id===id)||null}
function roleLabel(m){if(!m)return 'Guest';if(m.is_admin)return 'Administrator';return m.account_type==='member'?'Lunarist Member':'User'}
function memberByUsername(u){u=String(u||'').toLowerCase();return data.members.find(m=>(m.username||'').toLowerCase()===u)||null}
const RESERVED_ROUTES=['discover','artists','services','admin','api'];
function pathForRoute(route){if(route==='home')return '/';if(route==='discover')return '/discover';if(route==='artists')return '/artists';if(route==='services')return '/services';if(route==='admin')return '/admin';if(route.startsWith('member:')){const m=member(route.split(':')[1]);return m?.username?('/'+m.username):'/artists'}return '/'}
function goRoute(route,replace){state.route=route;const path=pathForRoute(route);if(location.pathname!==path){history[replace?'replaceState':'pushState']({route},'',path)}render()}
function routeFromPath(){const seg=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));if(!seg)return 'home';if(seg==='discover')return 'discover';if(seg==='artists')return 'artists';if(seg==='services')return 'services';if(seg==='admin')return 'admin';if(RESERVED_ROUTES.includes(seg.toLowerCase()))return 'home';const m=memberByUsername(seg);return m?'member:'+m.id:'home'}
function extractYoutubeId(url){
  if(!url) return null;
  const s = String(url).trim();
  let m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return null;
}
function embedToWatchUrl(u){const m=String(u||'').match(/embed\/([A-Za-z0-9_-]{11})/);return m?('https://youtu.be/'+m[1]):''}
window.addEventListener('popstate',()=>{state.route=routeFromPath();render()});
async function uploadProjectFile(file,kind){if(!file)return null;const ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=`${state.currentUser.id}/${crypto.randomUUID()}-${kind}.${ext}`;const up=await supabaseClient.storage.from('project-media').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;const pub=supabaseClient.storage.from('project-media').getPublicUrl(path);return pub.data.publicUrl}
function score(p){
  const interests=state.session.interests||{};
  const category=String(p?.category||'');
  const tags=Array.isArray(p?.tags)?p.tags:[];
  const interestRaw=Number(interests[category]||0);
  const tagRaw=tags.reduce((n,t)=>n+Number(interests[t]||0),0);
  return Math.min(100,(Math.min(1,(interestRaw/10)+(tagRaw/40))*40)+(Math.min(1,tagRaw/20)*20)+(Math.min(1,Number(p?.views||0)/5000)*15)+(Math.max(0,1-(Math.max(0,(Date.now()-(Date.parse(p?.created_at||'')||Date.now())))/86400000)/180)*10)+(p?.member&&state.session.viewed.includes(p.member)?8:2)+5);
}
function personalized(){
  const ranked=(data.recommendations||[]).map(r=>data.projects.find(p=>p.id===r.project_id)).filter(Boolean);
  return ranked.length?ranked:[...data.projects].sort((a,b)=>score(b)-score(a));
}
async function refreshRecommendations(){
  if(!state.backendReady)return;
  try{
    const r=await fetch('/api/lunarist?resource=recommendations&session_id='+encodeURIComponent(state.session.id)+'&limit=5');
    if(!r.ok)throw new Error('Recommendation service unavailable');
    const rows=await r.json();
    data.recommendations=Array.isArray(rows)?rows:[];
  }catch(e){data.recommendations=[];}
}
async function track(p,type='view'){state.session.interests[p.category]=(state.session.interests[p.category]||0)+(type==='like'?4:1);(p.tags||[]).forEach(t=>state.session.interests[t]=(state.session.interests[t]||0)+(type==='like'?.7:.15));if(!state.session.viewed.includes(p.id))state.session.viewed.unshift(p.id);state.session.viewed=state.session.viewed.slice(0,30);saveSession();if(state.backendReady)fetch('/api/lunarist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:{session_id:state.session.id,project_id:p.id,event_type:type,category:p.category,metadata:{tags:p.tags||[]}}})}).catch(()=>{});}
function avatar(m){return `<img class="avatar" src="${esc(m?.avatar||'https://i.pravatar.cc/160?u=unknown')}" alt="${esc(m?.name||'Artist')}">`}
function card(p,feature=false){
  const m=member(p.member);
  return `<article class="card ${feature?'feature':''}" data-project="${p.id}">
    <div class="thumb">
      <img src="${esc(p.image||'')}" alt="${esc(p.title)}" loading="lazy">
      <div class="overlay"><span class="badge">${esc(p.category)}</span></div>
    </div>
    <div class="cardbody">
      <div class="title">${esc(p.title)}</div>
      <div class="meta artist">${avatar(m)}<span>${esc(m?.name||'Unknown artist')} · ${formatViews(p.views)} views</span></div>
      <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
  </article>`;
}
function serviceCard(s){const m=member(s.member);return `<article class="card" data-service="${s.id}"><div class="thumb"><img src="${esc(s.thumbnail_url||'')}" alt="${esc(s.title)}" loading="lazy" onerror="this.style.opacity=0"><div class="overlay"><span class="badge">${esc(s.category)}</span></div></div><div class="cardbody"><div class="title">${esc(s.title)}</div><div class="meta artist">${avatar(m)}<span>${esc(m?.name||'Unknown artist')}</span></div><div class="meta">${[s.price_from?('From '+esc(s.price_from)):'',esc(s.delivery_time||'')].filter(Boolean).join(' · ')}</div><div class="tags">${(s.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function services(){let list=data.services;if(state.query){const q=state.query.toLowerCase();list=list.filter(s=>(s.title+' '+s.category+' '+(s.tags||[]).join(' ')+' '+(member(s.member)?.name||'')).toLowerCase().includes(q))}return `<div class="container"><section class="section" style="padding-top:55px"><div class="sectionhead"><div><div class="eyebrow">Hire the collective</div><h2 style="font-size:46px">Services.</h2><p>Book Lunarist members directly for commissions and packages.</p></div><input class="search" id="searchInput" placeholder="Search services, artists…" value="${esc(state.query)}"></div><div class="grid" id="servicesGrid">${list.length?list.map(serviceCard).join(''):emptyState('No services listed yet.','Lunarist Members can list services from their dashboard.')}</div></section></div>`}

function addonAmount(base,ao){
  const n=Number(ao?.price||0);
  return ao?.type==='percent' ? (base*n/100) : n;
}
function addonLabel(ao){
  return ao?.type==='percent' ? ('+'+Number(ao.price||0)+'%') : ('+$'+Number(ao.price||0).toFixed(2));
}
function addonIcon(title){
  const t=String(title||'').toLowerCase();
  if(t.includes('commercial'))return '💼';
  if(t.includes('rush')||t.includes('expedite')||t.includes('priority'))return '⚡';
  if(t.includes('nda')||t.includes('private'))return '🔒';
  if(t.includes('revision'))return '🔁';
  return '✦';
}

function openService(id){
  const s=data.services.find(x=>x.id===id);if(!s)return;
  const m=member(s.member);
  const examples=(s.projectIds||[]).map(pid=>data.projects.find(p=>p.id===pid)).filter(Boolean);
  const addOns = Array.isArray(s.add_ons) ? s.add_ons : [];
  const basePrice = parseFloat(String(s.price_from||'0').replace(/[^0-9.]/g,''))||0;
  const canCheckout = basePrice>0;

  document.getElementById('modalMedia').innerHTML=`<img src="${esc(s.thumbnail_url||'')}" style="width:100%;height:100%;object-fit:cover" alt="">`;
  document.getElementById('modalContent').innerHTML=`
    <div class="eyebrow">${esc(s.category)}</div>
    <h2>${esc(s.title)}</h2>
    <div class="artist">${avatar(m)}<button class="btn" data-modal-member="${m?.id||''}">${esc(m?.name||'Unknown artist')} · View profile</button></div>
    <p>${formatDescription(s.description)}</p>
    <div class="stats">
      ${s.price_from?`<span class="stat">From ${esc(s.price_from)}</span>`:''}
      ${s.delivery_time?`<span class="stat">${esc(s.delivery_time)}</span>`:''}
    </div>

    ${examples.length?`<div class="sectionhead" style="margin-top:22px"><div><h3 style="margin:0">Portfolio examples</h3></div></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${examples.map(p=>card(p)).join('')}</div>`:''}

    <div style="margin-top:26px;padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02)">
      <h2 style="font-size:26px;margin:0 0 6px;font-style:italic">Inquire — ${esc(s.title)}</h2>
      <p id="inquirySubtext" style="color:var(--muted);margin-top:0"></p>

      <div class="formgrid" style="margin-top:16px">
        <div class="field"><label>Your Name / Handle *</label><input id="inqName" placeholder="Your name or handle"></div>
        <div class="field"><label>Company / Agency Name (Optional)</label><input id="inqCompany" placeholder="Studio or agency"></div>
        <div class="field"><label>Your Email Address *</label><input id="inqEmail" type="email" placeholder="you@example.com"></div>
        <div class="field"><label>Social Media e.g. @Handle *</label><input id="inqSocial" placeholder="@yourhandle"></div>
        <div class="field full"><label>Target Deadline / Preferred Delivery Date (Optional)</label><input id="inqDeadline" type="date"></div>
        <div class="field full"><label>Project Brief &amp; Description (Optional)</label><textarea id="inqBrief" placeholder="Tell them what you have in mind…"></textarea></div>
      </div>

      ${addOns.length?`
        <div style="margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)">
          <div class="eyebrow" style="margin-bottom:10px;color:var(--gold)">TOS Add-ons &amp; Custom Options:</div>
          <div style="display:flex;flex-direction:column;gap:8px" id="svcModalAddons">
            ${addOns.map((ao,idx)=>`
              <div class="addon-box">
                <label><input type="checkbox" class="modalAddonCheck" data-idx="${idx}"> ${addonIcon(ao.title)} ${esc(ao.title)} (${addonLabel(ao)})</label>
              </div>
            `).join('')}
          </div>
        </div>
      `:''}

      <div class="field full" style="margin-top:14px"><label>Upload Brief / Asset Attachment (Optional)</label><input type="file" id="inqAttachment"><div class="meta" id="inqAttachStatus">Images or documents, up to 5MB.</div></div>

      ${m?.tos?`
        <div class="tos-box" style="max-height:220px">
          <div class="eyebrow" style="margin-bottom:6px">Terms of Service (TOS)</div>
          <div>${formatDescription(m.tos)}</div>
        </div>
      `:''}

      <div class="addon-box" style="margin-top:14px">
        <label><input type="checkbox" id="inqAgreeTos"> I have read and agree to the ${m?.tos?"Terms of Service":"artist's terms"} (Required)</label>
      </div>

      ${canCheckout?`
        <div class="formgrid" style="margin-top:14px">
          <div class="field" id="depositOption" style="cursor:pointer;border:1px solid var(--gold);border-radius:12px;padding:12px;text-align:center">
            <b style="color:var(--gold)" id="depositAmountLabel">50% Deposit</b>
            <div class="meta" id="depositSubLabel">Save Slot</div>
          </div>
          <div class="field" id="fullOption" style="cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center">
            <b id="fullAmountLabel">Full Amount</b>
            <div class="meta">Pay Upfront</div>
          </div>
        </div>
        <button class="btn primary" id="payPaypalBtn" style="width:100%;margin-top:16px;background:#ffc439;color:#0a0810;border-color:#ffc439;font-weight:900">PayPal</button>
        <button class="btn" id="payCardBtn" style="width:100%;margin-top:10px">💳 Debit or Credit Card</button>
        <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:8px">Powered by PayPal</p>
      `:`
        <button class="btn primary" id="sendInquiryBtn" style="width:100%;margin-top:16px">Send Inquiry</button>
      `}
      <p id="inquiryMsg" style="color:var(--danger);min-height:18px;margin-top:8px"></p>
    </div>

    <div class="tags" style="margin-top:16px">${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  `;

  document.getElementById('projectModal').classList.add('open');

  let paymentType='deposit';
  let pendingAttachmentUrl=null;

  function computeTotals(){
    const checked=Array.from(document.querySelectorAll('.modalAddonCheck:checked'));
    const addonTotal=checked.reduce((n,cb)=>n+addonAmount(basePrice,addOns[Number(cb.dataset.idx)]),0);
    const total=basePrice+addonTotal;
    return {total,deposit:total/2};
  }
  function refreshPaymentUI(){
    if(!canCheckout)return;
    const {total,deposit}=computeTotals();
    document.getElementById('depositAmountLabel').textContent='50% Deposit ($'+deposit.toFixed(2)+')';
    document.getElementById('fullAmountLabel').textContent='Full Amount ($'+total.toFixed(2)+')';
    document.getElementById('inquirySubtext').textContent=`Inquiry for ${s.title} · Pay $${(paymentType==='deposit'?deposit:total).toFixed(2)} USD (${paymentType==='deposit'?'50% Slot Deposit':'Full Amount'}) to auto-register on the waitlist.`;
    const depEl=document.getElementById('depositOption'),fullEl=document.getElementById('fullOption');
    depEl.style.borderColor=paymentType==='deposit'?'var(--gold)':'var(--line)';
    fullEl.style.borderColor=paymentType==='full'?'var(--gold)':'var(--line)';
  }
  if(canCheckout){
    refreshPaymentUI();
    document.getElementById('depositOption').onclick=()=>{paymentType='deposit';refreshPaymentUI()};
    document.getElementById('fullOption').onclick=()=>{paymentType='full';refreshPaymentUI()};
  }else{
    document.getElementById('inquirySubtext').textContent=`Inquiry for ${s.title} · This artist provides a custom quote — send your brief and they'll follow up.`;
  }
  document.querySelectorAll('.modalAddonCheck').forEach(cb=>cb.onchange=refreshPaymentUI);

  document.getElementById('inqAttachment')?.addEventListener('change',async(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const statusEl=document.getElementById('inqAttachStatus');
    if(file.size>5*1024*1024){toast('File must be under 5MB');e.target.value='';return}
    statusEl.textContent='Uploading…';
    try{
      const ext=(file.name.split('.').pop()||'bin').toLowerCase();
      const path=`inquiries/${crypto.randomUUID()}.${ext}`;
      const up=await supabaseClient.storage.from('commission-uploads').upload(path,file,{upsert:false,contentType:file.type||undefined});
      if(up.error)throw up.error;
      pendingAttachmentUrl=supabaseClient.storage.from('commission-uploads').getPublicUrl(path).data.publicUrl;
      statusEl.textContent='Attached: '+file.name;
    }catch(err){statusEl.textContent='Upload failed.';toast(err.message||'Could not upload attachment')}
  });

  function collectInquiry(){
    const name=document.getElementById('inqName').value.trim();
    const email=document.getElementById('inqEmail').value.trim();
    const social=document.getElementById('inqSocial').value.trim();
    const agree=document.getElementById('inqAgreeTos').checked;
    const msgEl=document.getElementById('inquiryMsg');
    if(!name||!email||!social){msgEl.textContent='Please fill in your name, email and social handle.';return null}
    if(!agree){msgEl.textContent='Please agree to the Terms of Service to continue.';return null}
    msgEl.textContent='';
    return {
      name,email,social,
      company:document.getElementById('inqCompany').value.trim(),
      target_deadline:document.getElementById('inqDeadline').value||null,
      message:document.getElementById('inqBrief').value.trim(),
      attachment_url:pendingAttachmentUrl,
      addon_titles:Array.from(document.querySelectorAll('.modalAddonCheck:checked')).map(cb=>addOns[Number(cb.dataset.idx)].title)
    };
  }

  async function submitPayment(){
    const info=collectInquiry();if(!info)return;
    const btns=[document.getElementById('payPaypalBtn'),document.getElementById('payCardBtn')];
    btns.forEach(b=>b&&(b.disabled=true));
    document.getElementById('inquiryMsg').style.color='var(--muted)';
    document.getElementById('inquiryMsg').textContent='Redirecting to PayPal…';
    try{
      const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        service_id:s.id,
        addon_titles:info.addon_titles,
        payment_type:paymentType,
        customer:{name:info.name,email:info.email,company:info.company,social:info.social,target_deadline:info.target_deadline,message:info.message,attachment_url:info.attachment_url}
      })});
      const od=await r.json();
      if(!r.ok)throw new Error(od?.error||'Unable to start checkout.');
      const approve=(od.links||[]).find(l=>l.rel==='approve'||l.rel==='payer-action');
      if(approve?.href){window.location.href=approve.href}
      else throw new Error('PayPal did not return a checkout link.');
    }catch(e){
      document.getElementById('inquiryMsg').style.color='var(--danger)';
      document.getElementById('inquiryMsg').textContent=e.message||'Something went wrong starting checkout.';
      btns.forEach(b=>b&&(b.disabled=false));
    }
  }
  document.getElementById('payPaypalBtn')?.addEventListener('click',submitPayment);
  document.getElementById('payCardBtn')?.addEventListener('click',submitPayment);

  document.getElementById('sendInquiryBtn')?.addEventListener('click',async()=>{
    const info=collectInquiry();if(!info)return;
    const btn=document.getElementById('sendInquiryBtn');btn.disabled=true;
    try{
      const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        action:'inquiry_only',
        service_id:s.id,
        addon_titles:info.addon_titles,
        customer:{name:info.name,email:info.email,company:info.company,social:info.social,target_deadline:info.target_deadline,message:info.message,attachment_url:info.attachment_url}
      })});
      const rr=await r.json();
      if(!r.ok)throw new Error(rr?.error||'Unable to send inquiry.');
      toast('Inquiry sent — the artist will follow up by email.');
      closeModal();
    }catch(e){
      document.getElementById('inquiryMsg').textContent=e.message||'Something went wrong sending your inquiry.';
      btn.disabled=false;
    }
  });

  const mb=document.querySelector('[data-modal-member]');
  if(mb)mb.onclick=()=>{if(m){closeModal();goRoute('member:'+m.id)}};
  document.querySelectorAll('[data-project]').forEach(c=>c.onclick=()=>{closeModal();openProject(c.dataset.project)});
}

function emptyState(title='Nothing here yet.',text='Lunarist is waiting for its next creative signal.'){return `<div class="empty" style="grid-column:1/-1"><strong style="color:var(--text);display:block;margin-bottom:6px">${esc(title)}</strong>${esc(text)}</div>`}
function home(){const rec=personalized(),trending=[...data.projects].sort((a,b)=>b.likes-a.likes),recent=[...data.projects].sort((a,b)=>(Date.parse(b.created_at||'')||0)-(Date.parse(a.created_at||'')||0));return `<div class="container"><section class="hero"><div class="eyebrow">A creative network by Lunarist Studio</div><h1>Unleash<br><em>Your Dream.</em></h1><p>Lunarist is a living portfolio where every artist can publish, every project can be discovered, and every visitor gets a different creative journey.</p><div class="heroactions"><button class="btn primary" data-route="discover">Explore the work</button><button class="btn" data-route="artists">Meet our artists</button></div></section><section class="section"><div class="sectionhead"><div><h2>For you</h2><p>Curated from what you explore.</p></div><span class="eyebrow">Personalized</span></div><div class="grid">${rec.length?rec.slice(0,5).map((p,i)=>card(p,i===0)).join(''):emptyState('No published work yet.','Create the first Lunarist project from your member space.')}</div></section><section class="section"><div class="sectionhead"><div><h2>Trending this week</h2><p>What the Lunarist community is watching.</p></div><span class="eyebrow">Popular</span></div><div class="grid">${trending.length?trending.slice(0,4).map(p=>card(p)).join(''):emptyState()}</div></section><section class="section"><div class="split"><div class="panel"><div class="sectionhead"><div><h2>Artists</h2><p>Find the right creative voice.</p></div><button class="btn" data-route="artists">View all</button></div><div class="artistgrid">${data.members.length?data.members.map(artistCard).join(''):emptyState('No public artist profiles yet.','Create an account to become one.')}</div></div><div class="panel"><div class="eyebrow">Discovery engine</div><h2 style="font-size:30px;letter-spacing:-.04em">Not everything has to match your taste.</h2><p style="color:var(--muted)">Lunarist mixes relevance with exploration, so your feed can introduce you to artists and disciplines you would not normally click.</p><button class="btn pink" data-action="reset-interest">Reset my feed</button></div></div></section><section class="section"><div class="sectionhead"><div><h2>New arrivals</h2><p>Fresh published work from the studio.</p></div></div><div class="grid">${recent.length?recent.slice(0,4).map(p=>card(p)).join(''):emptyState()}</div></section></div>`}
function artistCard(m){return `<article class="artistcard" data-member="${m.id}">${avatar(m)}<div class="artistname">${esc(m.name)}</div><div class="role">${esc(m.role)}</div>${m.is_admin?'<span class="badge" style="display:inline-block;margin-top:8px">Administrator</span>':''}<div class="tags">${(m.skills||[]).slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div style="margin-top:12px;font-size:11px;color:${m.available?'var(--green)':'var(--muted)'}">${m.available?'● Available':'● Booked'}</div></article>`}
function discover(){let list=data.projects.filter(p=>state.filter==='All'||state.filter==='Recommended'||state.filter==='Trending'||state.filter==='Newest'||p.category===state.filter||(p.tags||[]).includes(state.filter));if(state.query){const q=state.query.toLowerCase();list=list.filter(p=>(p.title+' '+p.category+' '+(p.tags||[]).join(' ')+' '+(member(p.member)?.name||'')).toLowerCase().includes(q))}list.sort((a,b)=>state.filter==='Recommended'?score(b)-score(a):state.filter==='Trending'?b.likes-a.likes:state.filter==='Newest'?(Date.parse(b.created_at||'')||0)-(Date.parse(a.created_at||'')||0):score(b)-score(a));const cats=['All','Recommended','Trending','Newest',...new Set(data.projects.map(p=>p.category))];return `<div class="container"><section class="section" style="padding-top:55px"><div class="sectionhead"><div><div class="eyebrow">Explore Lunarist</div><h2 style="font-size:46px">Discover work.</h2><p>Search projects, styles and artists.</p></div><input class="search" id="searchInput" placeholder="Search projects, artists, skills…" value="${esc(state.query)}"></div><div class="discoverbar">${cats.map(c=>`<button class="filter ${state.filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid" id="discoverGrid">${list.length?list.map(p=>card(p)).join(''):emptyState('No work found.','Try another search or filter.')}</div></section></div>`}
function artists(){return `<div class="container"><section class="section" style="padding-top:55px"><div class="eyebrow">The Lunarist collective</div><h2 style="font-size:52px;letter-spacing:-.05em;margin:10px 0">Meet the artists.</h2><p style="color:var(--muted);max-width:650px">Every member owns their profile and projects. Clients can discover people by discipline, style and availability.</p><div class="artistgrid" style="margin-top:28px">${data.members.length?data.members.map(artistCard).join(''):emptyState('No public artist profiles yet.','Create an account to become one.')}</div></section></div>`}

function profilePage(m){
  const ps=data.projects.filter(p=>p.member===m.id);
  const ss=data.services.filter(s=>s.member===m.id);
  applyTheme(m.theme || 'moonlight');
  
  return `<div class="container"><section class="section" style="padding-top:55px"><div class="row" style="justify-content:space-between"><button class="btn" data-route="artists">← Artists</button><button class="btn" id="copyProfileLink" data-username="${esc(m.username)}">Copy profile link</button></div><div class="panel" style="margin-top:16px;padding:30px"><div class="row" style="align-items:flex-start"><img class="avatar" style="width:86px;height:86px" src="${esc(m.avatar)}" alt=""><div><div class="eyebrow">@${esc(m.username)}${m.is_admin?' · Administrator':' · Lunarist Member'}</div><h2 style="font-size:42px;margin:3px 0">${esc(m.name)}</h2><div style="color:var(--muted)">${esc(m.role)}</div><p style="max-width:650px;color:var(--muted)">${formatDescription(m.bio)}</p><div class="tags">${(m.skills||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div style="margin-top:14px;color:${m.available?'var(--green)':'var(--muted)'}">${m.available?'● Available for commissions':'● Currently booked'}</div></div></div></div><div class="sectionhead" style="margin-top:38px"><div><h2>Selected work</h2><p>${ps.length} published projects</p></div></div><div class="grid">${ps.length?ps.map(p=>card(p)).join(''):emptyState('No published projects yet.')}</div><div class="sectionhead" style="margin-top:38px"><div><h2>Services</h2><p>${ss.length} listed</p></div></div><div class="grid">${ss.length?ss.map(serviceCard).join(''):emptyState('No services listed yet.')}</div>${String(m.tos||'').trim()?`<div class="sectionhead" style="margin-top:38px"><div><h2>Terms of Service (TOS)</h2><p>Client policies & commission rules</p></div></div><div class="panel tos-box" style="margin-top:0"><div>${formatDescription(String(m.tos||'').trim())}</div></div>`:''}</section></div>`

function render(){
  document.querySelectorAll('.navbtn[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));
  if(!state.route.startsWith('member:')){ applyTheme(state.currentMember?.theme || 'moonlight'); }
  let html=state.loadError?`<div class="container"><section class="section" style="padding-top:90px"><div class="empty"><strong style="color:var(--danger);display:block;margin-bottom:8px">Lunarist couldn't load its database.</strong><span>${esc(state.loadError)}</span><div class="heroactions" style="justify-content:center"><button class="btn primary" id="retryBtn">Retry</button></div></div></section></div>`:state.route==='home'?home():state.route==='discover'?discover():state.route==='services'?services():state.route==='artists'?artists():state.route==='admin'?`<div class="container"><section class="section" style="padding-top:55px" id="adminPageView"></section></div>`:state.route.startsWith('member:')?profilePage(member(state.route.split(':')[1])):home();
  document.getElementById('view').innerHTML=html;
  bind();
  if(state.route==='admin') renderAdminStudioPage();
  window.scrollTo({top:0,behavior:'instant'})
}

function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{document.getElementById('navlinks').classList.remove('open');goRoute(b.dataset.route)});document.querySelectorAll('[data-project]').forEach(c=>c.onclick=()=>openProject(c.dataset.project));document.querySelectorAll('[data-service]').forEach(c=>c.onclick=()=>openService(c.dataset.service));document.querySelectorAll('[data-member]').forEach(c=>c.onclick=()=>goRoute('member:'+c.dataset.member));document.getElementById('copyProfileLink')?.addEventListener('click',(e)=>{const url=location.origin+'/'+e.currentTarget.dataset.username;navigator.clipboard?.writeText(url).then(()=>toast('Profile link copied')).catch(()=>toast(url))});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});const s=document.getElementById('searchInput');if(s)s.oninput=e=>{state.query=e.target.value;render()};document.querySelector('[data-action="reset-interest"]')?.addEventListener('click',async()=>{state.session.interests={};state.session.viewed=[];data.recommendations=[];saveSession();await refreshRecommendations();toast('Your discovery profile was reset');render()});document.getElementById('retryBtn')?.addEventListener('click',()=>loadData());}

async function openProject(id){
  const p=data.projects.find(x=>x.id===id);if(!p)return;
  await track(p);
  const m=member(p.member);
  const linkedServices=data.services.filter(sv=>(sv.projectIds||[]).includes(p.id));

  document.getElementById('modalMedia').innerHTML=p.video?`<iframe src="${esc(p.video)}${p.video.includes('?')?'&':'?'}autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:`<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover" alt="">`;
  
  document.getElementById('modalContent').innerHTML=`
    <div class="eyebrow">${esc(p.category)}</div>
    <h2>${esc(p.title)}</h2>
    <div class="artist" style="gap:12px;margin-bottom:14px">
      ${avatar(m)}
      <div>
        <div style="font-weight:700">${esc(m?.name||'Unknown artist')}</div>
        <div class="meta" style="margin-top:0">${esc(m?.role||'')}</div>
      </div>
      <button class="btn" data-modal-member="${m?.id||''}" style="margin-left:auto;font-size:12px;padding:6px 12px">View Artist profile →</button>

function setupProjectDragAndDrop(){
  const container=document.getElementById('projectList');
  if(!container)return;

  container.querySelectorAll('.listitem.draggable').forEach(item=>{
    item.addEventListener('dragstart',(e)=>{
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',item.dataset.id);
    });

    item.addEventListener('dragend',async()=>{
      item.classList.remove('dragging');
      await saveNewProjectOrder();
    });

    item.addEventListener('dragover',(e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const draggingItem=container.querySelector('.dragging');
      if(!draggingItem||draggingItem===item)return;

      const rect=item.getBoundingClientRect();
      const next=(e.clientY-rect.top)/(rect.bottom-rect.top)>0.5;
      container.insertBefore(draggingItem,next?item.nextSibling:item);
    });
  });

  async function saveNewProjectOrder(){
    const items=Array.from(container.querySelectorAll('.listitem.draggable'));
    const updates=items.map((el,index)=>({
      id:el.dataset.id,
      position:index+1
    }));

    if(state.myProjects&&state.myProjects.length){
      state.myProjects.sort((a,b)=>{
        const idxA=updates.findIndex(u=>u.id===a.id);
        const idxB=updates.findIndex(u=>u.id===b.id);
        return idxA-idxB;
      });
    }

    for(const update of updates){
      await supabaseClient.from('projects').update({position:update.position}).eq('id',update.id);
    }
    toast('Project order saved');
    await loadData();
  }
}

async function loadAdvancedAnalytics(allProjects,allServices){
  const since=new Date(Date.now()-14*86400000).toISOString();
  const [{data:events,error:evErr},{data:commissions,error:coErr}]=await Promise.all([
    supabaseClient.from('discovery_events').select('event_type,created_at').gte('created_at',since).order('created_at',{ascending:true}).limit(5000),
    supabaseClient.from('commissions').select('service_id,status,payment_type,deposit_amount,total_amount,created_at').order('created_at',{ascending:false}).limit(2000)
  ]);
  if(evErr||coErr)return {error:(evErr||coErr).message};

  const days=[];
  for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*86400000);days.push(d.toISOString().slice(0,10))}
  const trend=Object.fromEntries(days.map(d=>[d,{view:0,like:0,save:0}]));
  (events||[]).forEach(e=>{
    const day=String(e.created_at||'').slice(0,10);
    if(trend[day]&&trend[day][e.event_type]!==undefined)trend[day][e.event_type]++;
  });

  const collected=c=>c.payment_type==='deposit'?Number(c.deposit_amount||0):Number(c.total_amount||0);
  const rows=commissions||[];
  const paid=rows.filter(c=>c.status==='paid'||c.status==='completed');
  const pending=rows.filter(c=>['new','contacted','accepted'].includes(c.status));
  const totalRevenue=paid.reduce((n,c)=>n+collected(c),0);
  const pendingRevenue=pending.reduce((n,c)=>n+collected(c),0);
  const depositCount=paid.filter(c=>c.payment_type==='deposit').length;
  const fullCount=paid.filter(c=>c.payment_type!=='deposit').length;
  const conversionRate=rows.length?Math.round((paid.length/rows.length)*100):0;
  const avgOrderValue=paid.length?(totalRevenue/paid.length):0;

  const funnelOrder=['new','contacted','accepted','paid','completed','declined','archived'];
  const funnel=Object.fromEntries(funnelOrder.map(s=>[s,0]));
  rows.forEach(c=>{if(funnel[c.status]!==undefined)funnel[c.status]++});

  const serviceTitle=id=>(allServices||[]).find(s=>s.id===id)?.title||'Unknown service';
  const byService={};
  paid.forEach(c=>{const key=c.service_id||'unknown';byService[key]=(byService[key]||0)+collected(c)});
  const topServices=Object.entries(byService).map(([id,revenue])=>({title:serviceTitle(id),revenue})).sort((a,b)=>b.revenue-a.revenue).slice(0,5);

  const byCategory={};
  (allProjects||[]).forEach(p=>{const cat=p.category||'Uncategorized';byCategory[cat]=(byCategory[cat]||0)+Number(p.views||0)});
  const topCategories=Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).slice(0,6);

  return {
    trendDays:days,trend,
    totalRevenue,pendingRevenue,depositCount,fullCount,conversionRate,avgOrderValue,
    funnel,topServices,topCategories,
    totalEvents:(events||[]).length,totalCommissions:rows.length
  };
}

        <div style="margin-top:12px">${allServices.map(serviceRow).join('') || '<div class="meta">No services found.</div>'}</div>
      </div>
    </div>

    <div data-studio-panel="members" style="${activeTab==='members'?'':'display:none'}">
      <div class="panel">
        <div class="eyebrow">Members Management</div>
        <div style="margin-top:12px">${memberRows}</div>
      </div>
    </div>

    <div data-studio-panel="analytics" style="${activeTab==='analytics'?'':'display:none'}">
      ${analytics.error?`<div class="panel"><h3>Analytics unavailable</h3><p style="color:var(--muted)">${esc(analytics.error)}</p></div>`:`
      <div class="panel" style="margin-bottom:16px">
        <div class="eyebrow">Revenue</div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:10px">
          <div class="stat"><b>$${analytics.totalRevenue.toFixed(2)}</b><span>Collected</span></div>
          <div class="stat"><b>$${analytics.pendingRevenue.toFixed(2)}</b><span>Pending (in queue)</span></div>
          <div class="stat"><b>$${analytics.avgOrderValue.toFixed(2)}</b><span>Avg. order value</span></div>
          <div class="stat"><b>${analytics.conversionRate}%</b><span>Inquiry → paid</span></div>
          <div class="stat"><b>${analytics.depositCount} / ${analytics.fullCount}</b><span>Deposits / Full paid</span></div>
        </div>
      </div>

      <div class="split" style="margin-bottom:16px">
        <div class="panel">
          <div class="eyebrow">Engagement — last 14 days</div>
          <div style="height:220px;margin-top:10px"><canvas id="chartEngagementTrend"></canvas></div>
        </div>
        <div class="panel">
          <div class="eyebrow">Commission funnel</div>
          <div style="height:220px;margin-top:10px"><canvas id="chartFunnel"></canvas></div>
        </div>
      </div>

      <div class="split">
        <div class="panel">
          <div class="eyebrow">Top services by revenue</div>
          <div style="height:220px;margin-top:10px">${analytics.topServices.length?`<canvas id="chartRevenueByService"></canvas>`:'<div class="meta" style="padding:16px 0">No paid commissions yet.</div>'}</div>
        </div>
        <div class="panel">
          <div class="eyebrow">Views by category</div>
          <div style="height:220px;margin-top:10px">${analytics.topCategories.length?`<canvas id="chartCategoryViews"></canvas>`:'<div class="meta" style="padding:16px 0">No published projects yet.</div>'}</div>
        </div>
      </div>
      `}
    </div>

    <div data-studio-panel="settings" style="${activeTab==='settings'?'':'display:none'}">
      <div class="panel">
        <div class="eyebrow">Studio Settings</div>
        <div class="field" style="margin-top:10px"><label>Studio name</label><input id="studioName" value="${esc(settingsMap.site_name||'Lunarist Studio')}"></div>
        <div class="field" style="margin-top:10px"><label>Tagline</label><input id="studioTagline" value="${esc(settingsMap.tagline||'Unleash Your Dream.')}"></div>
        <button class="btn primary" id="saveStudioSettings" style="margin-top:14px">Save settings</button>
        <p id="studioSettingsMsg" class="meta" style="margin-top:8px"></p>
      </div>
    </div>
  `;

  let chartsReady=false;
  const chartInstances={};
  function initAnalyticsCharts(){
    if(chartsReady||analytics.error||typeof Chart==='undefined')return;
    chartsReady=true;

    const trendCtx=document.getElementById('chartEngagementTrend');
    if(trendCtx){
      const labels=analytics.trendDays.map(d=>d.slice(5));
      chartInstances.trend=new Chart(trendCtx,{type:'line',data:{labels,datasets:[
        {label:'Views',data:analytics.trendDays.map(d=>analytics.trend[d].view),borderColor:'#c9b6ff',backgroundColor:'rgba(201,182,255,.15)',tension:.3,fill:true},
        {label:'Likes',data:analytics.trendDays.map(d=>analytics.trend[d].like),borderColor:'#ff86c8',backgroundColor:'rgba(255,134,200,.12)',tension:.3,fill:true},
        {label:'Saves',data:analytics.trendDays.map(d=>analytics.trend[d].save),borderColor:'#8ee0ba',backgroundColor:'rgba(142,224,186,.12)',tension:.3,fill:true}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9c96ad'}}},scales:{x:{ticks:{color:'#9c96ad'},grid:{color:'rgba(255,255,255,.06)'}},y:{ticks:{color:'#9c96ad'},grid:{color:'rgba(255,255,255,.06)'},beginAtZero:true}}}});
    }

    const funnelCtx=document.getElementById('chartFunnel');
    if(funnelCtx){
      const labels=Object.keys(analytics.funnel);
      chartInstances.funnel=new Chart(funnelCtx,{type:'bar',data:{labels,datasets:[{label:'Commissions',data:Object.values(analytics.funnel),backgroundColor:'#c9b6ff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9c96ad'},grid:{display:false}},y:{ticks:{color:'#9c96ad'},grid:{color:'rgba(255,255,255,.06)'},beginAtZero:true}}}});
    }

    const revCtx=document.getElementById('chartRevenueByService');
    if(revCtx){
      chartInstances.revenue=new Chart(revCtx,{type:'bar',data:{labels:analytics.topServices.map(s=>s.title),datasets:[{label:'Revenue',data:analytics.topServices.map(s=>s.revenue),backgroundColor:'#e8cf91'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9c96ad'},grid:{color:'rgba(255,255,255,.06)'},beginAtZero:true},y:{ticks:{color:'#9c96ad'},grid:{display:false}}}}});
    }

    const catCtx=document.getElementById('chartCategoryViews');
    if(catCtx){
      chartInstances.category=new Chart(catCtx,{type:'bar',data:{labels:analytics.topCategories.map(c=>c[0]),datasets:[{label:'Views',data:analytics.topCategories.map(c=>c[1]),backgroundColor:'#8ee0ba'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9c96ad'},grid:{display:false}},y:{ticks:{color:'#9c96ad'},grid:{color:'rgba(255,255,255,.06)'},beginAtZero:true}}}});
    }
  }
  if(activeTab==='analytics')initAnalyticsCharts();

  sec.querySelectorAll('[data-studio-tab]').forEach(btn=>btn.onclick=()=>{
    sec.querySelectorAll('[data-studio-tab]').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    sec.querySelectorAll('[data-studio-panel]').forEach(x=>x.style.display=x.dataset.studioPanel===btn.dataset.studioTab?'block':'none');
    if(btn.dataset.studioTab==='analytics')initAnalyticsCharts();
  });

  sec.querySelectorAll('[data-admin-pj-status]').forEach(el=>el.onchange=async()=>{
    const r=await supabaseClient.from('projects').update({status:el.value,published:el.value==='published',updated_at:new Date().toISOString()}).eq('id',el.dataset.adminPjStatus);
    if(r.error){toast(r.error.message)}else{toast('Project status updated');await loadData();renderAdminStudioPage('projects')}
  });

  sec.querySelectorAll('[data-admin-pj-approve]').forEach(btn=>btn.onclick=async()=>{
    const r=await supabaseClient.from('projects').update({status:'published',published:true,updated_at:new Date().toISOString()}).eq('id',btn.dataset.adminPjApprove);
    if(r.error){toast(r.error.message)}else{toast('Project approved & published!');await loadData();renderAdminStudioPage('overview')}
  });

  sec.querySelectorAll('[data-admin-sv-status]').forEach(el=>el.onchange=async()=>{
    const r=await supabaseClient.from('services').update({status:el.value,published:el.value==='published',updated_at:new Date().toISOString()}).eq('id',el.dataset.adminSvStatus);
    if(r.error){toast(r.error.message)}else{toast('Service status updated');await loadData();renderAdminStudioPage('services')}
  });

  sec.querySelectorAll('[data-admin-sv-approve]').forEach(btn=>btn.onclick=async()=>{
    const r=await supabaseClient.from('services').update({status:'published',published:true,updated_at:new Date().toISOString()}).eq('id',btn.dataset.adminSvApprove);
    if(r.error){toast(r.error.message)}else{toast('Service approved & published!');await loadData();renderAdminStudioPage('overview')}
  });

  sec.querySelectorAll('[data-admin-feature]').forEach(el=>el.onclick=async()=>{
    const id=el.dataset.adminFeature;
    const item=allProjects.find(x=>x.id===id);
    const r=await supabaseClient.from('projects').update({featured:!item?.featured,updated_at:new Date().toISOString()}).eq('id',id);
    if(r.error){toast(r.error.message)}else{toast(item?.featured?'Removed from featured':'Added to featured');await loadData();renderAdminStudioPage('projects')}
  });

  sec.querySelectorAll('[data-toggle-membertype]').forEach(el => el.onclick = async () => {
    const id = el.dataset.toggleMembertype;
    const next = el.dataset.current === 'member' ? 'user' : 'member';
    el.disabled = true;

    try {
      const res = await fetch('/api/lunarist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle-member', targetId: id, nextType: next })
      });
      const result = await res.json();

      if (!res.ok || result.error) {
        toast('Error: ' + (result.error || 'Failed to update member'));
        el.disabled = false;
      } else {
        toast(next === 'member' ? 'Promoted to Lunarist Member' : 'Reverted to User');
        await loadData();
        await refreshUser();
        renderAdminStudioPage('members');
      }
    } catch (err) {
      toast('Error connecting to server');
      el.disabled = false;
    }
  });

  document.getElementById('saveStudioSettings')?.addEventListener('click',async()=>{
    const msg=document.getElementById('studioSettingsMsg');
    const rows=[['site_name',document.getElementById('studioName').value.trim()],['tagline',document.getElementById('studioTagline').value.trim()]];
    for(const [key,value] of rows){
      const r=await supabaseClient.from('studio_settings').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'});
      if(r.error){msg.textContent=r.error.message;return}
    }
    msg.textContent='Settings saved.';toast('Studio settings saved');
  });
}

function closeDash(){document.getElementById('drawer').classList.remove('open')}
async function loadConfig(){const r=await fetch('/api/config');if(!r.ok)throw new Error('Lunarist configuration is missing on Vercel.');const c=await r.json();if(!c.url||!c.anonKey)throw new Error('SUPABASE_URL and SUPABASE_ANON_KEY are required.');supabaseClient=window.supabase.createClient(c.url,c.anonKey);supabaseClient.auth.onAuthStateChange(async()=>{await refreshUser();updateAccountButton()});await refreshUser()}
async function loadData(){
  state.loadError=null;
  try{
    if(!supabaseClient)await loadConfig();
    const [pr,pp,sv]=await Promise.all([
      fetch('/api/lunarist?resource=profiles').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()}),
      fetch('/api/lunarist?resource=projects').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()}),
      fetch('/api/lunarist?resource=services').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()})
    ]);
    data.members=(Array.isArray(pr)?pr:[]).map(x=>({
      id:x.id,
      username:x.username,
      name:x.display_name,
      role:x.role||'',
      bio:x.bio||'',
      tos:x.tos||'',
      theme:x.theme||'moonlight',
      avatar:x.avatar_url||'https://i.pravatar.cc/160?u='+x.id,
      skills:x.skills||[],
      available:x.available!==false,
      account_type:x.account_type||'member',
      is_admin:!!x.is_admin
    }));

     // The public profiles API may omit TOS for legacy/security reasons.
     // Fetch the public TOS field directly so /username profiles can display it.
     try {
       const {data: publicTosRows, error: publicTosError} = await supabaseClient
         .from('profiles')
         .select('id,tos')
         .not('tos','is',null);
       if (!publicTosError && Array.isArray(publicTosRows)) {
         const tosById = new Map(publicTosRows.map(x=>[x.id, x.tos||'']));
         data.members.forEach(m=>{
           if (tosById.has(m.id)) m.tos = tosById.get(m.id);
         });
       }
     } catch(e) {
       // Keep API-provided TOS if the direct public query is unavailable.
     }
    
    data.projects=(Array.isArray(pp)?pp:[]).map(x=>({
      id:x.id,
      member:x.owner_id||x.artist_id,
      title:x.title,
      category:x.category,
      tags:x.tags||[],
      views:Number(x.views||0),
      likes:Number(x.likes||0),
      created_at:x.created_at,
      position:x.position,
      video:x.media_type==='video'?x.media_url:'',
      image:x.thumbnail_url||x.media_url||'',
      desc:x.description||'',
      description:x.description||'',
      published:x.published,
      status:x.status||(x.published?'published':'draft'),
      featured:!!x.featured,
      thumbnail_url:x.thumbnail_url,
      media_url:x.media_url,
      media_type:x.media_type
    }));

    data.services=(Array.isArray(sv)?sv:[]).map(x=>({id:x.id,member:x.owner_id||x.artist_id,title:x.title,category:x.category,tags:x.tags||[],price_from:x.price_from||'',delivery_time:x.delivery_time||'',thumbnail_url:x.thumbnail_url||'',views:Number(x.views||0),created_at:x.created_at,description:x.description||'',add_ons:x.add_ons||[],projectIds:(x.service_projects||[]).map(sp=>sp.project_id)}));
    
    state.backendReady=true;
    if(!state.routeInitialized){state.route=routeFromPath();state.routeInitialized=true}
    await refreshRecommendations();
    render();

    // Fetch live YouTube view counts in background for all projects
    data.projects.forEach(async (p) => {
      const vid = extractYoutubeId(p.media_url) || extractYoutubeId(p.video) || extractYoutubeId(p.thumbnail_url);
      if (vid) {
        try {
          const r = await fetch('/api/youtube?videoId=' + encodeURIComponent(vid));
          const res = await r.json();
          if (res && res.viewCount !== undefined && res.viewCount !== null) {
            p.views = Number(res.viewCount);
            supabaseClient.from('projects').update({ views: p.views }).eq('id', p.id).then(() => {});
            render();
          }
        } catch(e) {}
      }
    });

  }catch(e){
    state.backendReady=false;
    state.loadError=e.message||'Unable to connect to Supabase.';
    render()
  }
}

function updateAccountButton(){
  const b=document.getElementById('accountBtn');
  const isAdmin = state.currentMember?.is_admin;
  const navAdmin = document.getElementById('navAdminBtn');
  if(navAdmin) navAdmin.style.display = isAdmin ? 'inline-flex' : 'none';
  if(state.currentUser){
    b.title='Open member space · '+roleLabel(state.currentMember);
    document.getElementById('accountName').textContent=state.currentMember?.name||state.currentUser.email||'Member';
  }else{
    b.title='Sign in';
    document.getElementById('accountName').textContent='Guest';
  }
}
document.getElementById('accountBtn').onclick=()=>state.currentUser?openDashboard():openAuth('signin');document.getElementById('modalClose').onclick=closeModal;document.getElementById('projectModal').onclick=e=>{if(e.target.id==='projectModal')closeModal()};document.getElementById('drawerClose').onclick=closeDash;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDash()};document.getElementById('menuBtn').onclick=()=>document.getElementById('navlinks').classList.toggle('open');document.getElementById('authClose').onclick=closeAuth;document.getElementById('authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth()};document.getElementById('authSubmit').onclick=authSubmit;document.getElementById('authToggle').onclick=()=>openAuth(state.authMode==='signin'?'signup':'signin');document.getElementById('googleAuth').onclick=signInWithGoogle;document.getElementById('forgotPassword').onclick=resetPassword;
async function capturePaypalReturnIfPresent(){
  const params=new URLSearchParams(location.search);
  const paypalStatus=params.get('paypal');
  const orderId=params.get('token');
  if(paypalStatus==='success'&&orderId){
    try{
      const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'capture',order_id:orderId})});
      const d=await r.json();
      if(r.ok&&(d.status==='COMPLETED'||d.alreadyCaptured)){toast('Payment confirmed — thank you!')}
      else{toast('We could not confirm your payment automatically. The artist has your order on file.')}
    }catch(e){}
  }
  if(paypalStatus==='cancel'){toast('Checkout was cancelled — no charge was made.')}
  if(paypalStatus){
    params.delete('paypal');params.delete('token');params.delete('PayerID');
    const clean=location.pathname+(params.toString()?'?'+params.toString():'');
    history.replaceState({},'',clean);
  }
}
(async()=>{await loadData();updateAccountButton();await capturePaypalReturnIfPresent()})();
</script>
