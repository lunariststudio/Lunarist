 Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--moon)}h1{font-size:clamp(48px,8vw,105px);line-height:.9;letter-spacing:-.07em;max-width:900px;margin:18px 0 24px}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--moon)}.hero p{max-width:650px;color:var(--muted);font-size:18px}.heroactions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:700}.btn:hover{transform:translateY(-1px);border-color:rgba(201,182,255,.4)}.btn.primary{background:var(--text);color:#0a0810;border-color:var(--text)}.btn.pink{background:rgba(255,134,200,.12);color:var(--pink);border-color:rgba(255,134,200,.3)}.section{padding:30px 0 70px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.sectionhead h2{margin:0;font-size:28px;letter-spacing:-.03em}.sectionhead p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-radius:18px;overflow:hidden;transition:.22s;min-width:0}.card:hover{transform:translateY(-4px);border-color:rgba(201,182,255,.35);box-shadow:var(--shadow)}.thumb{aspect-ratio:16/10;background:#050509;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover .thumb img{transform:scale(1.04)}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62));display:flex;align-items:end;padding:12px}.badge{font:700 10px/1 IBM Plex Mono,monospace;border:1px solid rgba(255,255,255,.18);background:rgba(8,7,13,.72);padding:6px 8px;border-radius:999px}.cardbody{padding:14px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;color:#bbb4cb;background:rgba(201,182,255,.07);border:1px solid rgba(201,182,255,.14);padding:4px 7px;border-radius:999px}.row{display:flex;align-items:center;gap:9px}.grow{flex:1}.artist{display:flex;align-items:center;gap:9px}.artist .avatar{width:28px;height:28px}.feature{grid-column:span 2}.feature .thumb{aspect-ratio:16/9}.discoverbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:20px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}.filter.active{color:var(--text);background:rgba(201,182,255,.12);border-color:rgba(201,182,255,.35)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--radius);padding:22px}.artistgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.artistcard{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.artistcard:hover{border-color:rgba(201,182,255,.35)}.artistcard .avatar{width:52px;height:52px;margin-bottom:12px}.artistname{font-weight:800}.role{color:var(--muted);font-size:12px}.search{width:min(420px,100%);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}.search:focus{border-color:rgba(201,182,255,.45)}.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,1,6,.78);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(960px,100%);max-height:92vh;overflow:auto;background:#100e18;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.modalclose{position:absolute;right:18px;top:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;font-size:20px}.modalmedia{aspect-ratio:16/9;background:#000}.modalmedia iframe{width:100%;height:100%;border:0}.modalcontent{padding:24px}.modalcontent h2{font-size:34px;letter-spacing:-.04em;margin:0 0 8px}.modalcontent p{color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}.drawer{position:fixed;inset:0;z-index:90;display:none;background:rgba(0,0,0,.6)}.drawer.open{display:block}.drawerpanel{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);background:#0e0c15;border-left:1px solid var(--line);padding:22px;overflow:auto}.dashhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dashnav{display:flex;gap:6px;overflow:auto;margin-bottom:18px}.dashnav button{white-space:nowrap}.dashsection{display:none}.dashsection.active{display:block}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{border:1px solid var(--line);background:#0a0910;color:var(--text);padding:11px 12px;border-radius:11px;outline:none}.field input[type=file]{padding:9px;font-size:13px;color:var(--muted)}.field input[type=file]::file-selector-button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:7px 12px;border-radius:8px;font-weight:700;margin-right:10px;cursor:pointer}.field input[type=file]::file-selector-button:hover{background:rgba(255,255,255,.1)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.field textarea{min-height:100px;resize:vertical}.listitem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listthumb{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000}.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#f7f4ff;color:#09070d;padding:11px 16px;border-radius:999px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted)}.footer strong{color:var(--text)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.artistgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.navin{height:62px;padding:0 15px}.navlinks{display:none}.mobile{display:block;margin-left:auto}.navlinks.open{display:flex;position:absolute;left:10px;right:10px;top:62px;background:#0d0b13;border:1px solid var(--line);border-radius:15px;padding:8px;flex-direction:column}.hero{padding:62px 0 38px}.container{padding:0 15px}h1{font-size:55px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.feature{grid-column:span 2}.artistgrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.section{padding-bottom:45px}.sectionhead{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>

<body>
<div class="app" id="app">
<header class="nav"><div class="navin"><button class="brand" data-route="home">LUNARIST <span>✦</span></button><nav class="navlinks" id="navlinks"><button class="navbtn active" data-route="home">Home</button><button class="navbtn" data-route="discover">Discover</button><button class="navbtn" data-route="services">Services</button><button class="navbtn" data-route="artists">Artists</button></nav><button class="navbtn mobile" id="menuBtn">Menu</button><button class="userchip" id="accountBtn"><span class="avatar" id="accountAvatar">G</span><span id="accountName">Guest</span></button></div></header>

<footer class="footer"><div class="container row"><div class="grow"><strong>LUNARIST STUDIO</strong><br><span>Unleash Your Dream.</span></div><span>Creative network · 2026</span></div></footer>

<div class="modal" id="authModal" role="dialog" aria-modal="true"><div class="modalbox" style="max-width:420px"><button class="modalclose" id="authModalClose" aria-label="Close">×</button><div class="modalcontent">

</div>
</div></div></div>
<div class="drawer" id="drawer"><aside class="drawerpanel"><div class="dashhead"><div><div class="eyebrow">Member space</div><h2 id="dashTitle" style="margin:4px 0">Your Lunarist</h2></div><button class="iconbtn" id="drawerClose">×</button></div><div class="dashnav"><button class="filter active" data-dash="overview">Overview</button><button class="filter" data-dash="projects">My Projects</button><button class="filter" data-dash="services">Services</button><button class="filter" data-dash="commissions">Commissions</button><button class="filter" data-dash="profile">Profile</button></div><section class="dashsection active" id="dash-overview"></section><section class="dashsection" id="dash-projects"></section><section class="dashsection" id="dash-services"></section><section class="dashsection" id="dash-commissions"></section><section class="dashsection" id="dash-profile"></section></aside></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://xouvmwjssngrbnsumrnz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_7C_Cds49bF5CKF1mBvOj6w_OukuZzqS';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let authUser=null;
let authProfile=null;
const demo={
 members:[
  {id:'m1',username:'yujin',name:'Yujin',role:'Motion Designer · Animator',bio:'Turning music, characters and atmosphere into moving stories.',avatar:'https://i.pravatar.cc/160?img=12',skills:['Motion Design','MV','Compositing'],available:true},
  {id:'m2',username:'moffy',name:'Moffy',role:'Illustrator · Character Artist',bio:'Soft worlds, expressive characters and visual development.',avatar:'https://i.pravatar.cc/160?img=32',skills:['Illustration','Character','Concept'],available:true},
  {id:'m3',username:'astra',name:'Astra',role:'Graphic Designer',bio:'Identity, key visuals and sharp graphic systems.',avatar:'https://i.pravatar.cc/160?img=47',skills:['Graphic Design','Branding','PV'],available:false},
  {id:'m4',username:'noctis',name:'Noctis',role:'3D Artist · Compositor',bio:'Cinematic spaces, lighting and post-production.',avatar:'https://i.pravatar.cc/160?img=59',skills:['3D','Compositing','VFX'],available:true}
 ],
 projects:[
  {id:'p1',member:'m1',title:'Stellar Night — MV',category:'MV',tags:['MV','Motion Design','VTuber'],views:1840,likes:142,created:9,video:'https://www.youtube.com/embed/ScMzIvxBSi4',image:'https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg',desc:'A cinematic music video concept built around rhythm, glow and celestial motion.'},
  {id:'p2',member:'m2',title:'Moffy — Character Reel',category:'Illustration',tags:['Illustration','Character'],views:1260,likes:118,created:6,video:'',image:'https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=80',desc:'Character exploration and expressive illustration studies.'},
  {id:'p3',member:'m3',title:'Lunarist Visual Identity',category:'Graphic Design',tags:['Branding','Graphic Design'],views:920,likes:87,created:4,video:'',image:'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=900&q=80',desc:'A visual identity system for a dream-driven creative studio.'},
  {id:'p4',member:'m4',title:'Moonbase — 3D Environment',category:'3D',tags:['3D','VFX'],views:1510,likes:129,created:12,video:'',image:'https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=900&q=80',desc:'A moody 3D environment exploration with cinematic lighting.'}
 ],
 services:[]
};
const state={route:'home',filter:'All',query:'',session:getSession(),currentMember:null,backendReady:false};
function getSession(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('lunarist_session')||'null')}catch(e){}
  if(!s||typeof s!=='object')s={};
  s.id=typeof s.id==='string'&&s.id?s.id:'s_'+(Math.random().toString(36).slice(2));
  s.interests=s.interests&&typeof s.interests==='object'?s.interests:{};
  s.viewed=Array.isArray(s.viewed)?s.viewed:[];
  s.liked=Array.isArray(s.liked)?s.liked:[];
  localStorage.setItem('lunarist_session',JSON.stringify(s));
  return s
}
function saveSession(){localStorage.setItem('lunarist_session',JSON.stringify(state.session))}
function member(id){return demo.members.find(m=>m.id===id||m.username===id)||{id:id||'unknown',username:id||'unknown',name:id||'Unknown artist',role:'',bio:'',avatar:'https://i.pravatar.cc/160?u='+(id||'unknown'),skills:[],available:true}}
function score(p){
  const interests=state.session?.interests&&typeof state.session.interests==='object'?state.session.interests:{};
  const category=String(p?.category||'');
  const tags=Array.isArray(p?.tags)?p.tags:[];
  const interest=Number(interests[category]||0);
  const tagScore=tags.reduce((n,t)=>n+Number(interests[t]||0),0);
  const trend=Math.min(20,Number(p?.views||0)/150);
  const created=Number(p?.created||0);
  const fresh=created>1000000000000?Math.max(0,12-Math.max(0,(Date.now()-created)/86400000)*.45):0;
  const exploration=Math.random()*8;
  return interest*12+tagScore*4+trend+fresh+exploration
}
function personalized(){return [...demo.projects].sort((a,b)=>score(b)-score(a))}
function track(p,type='view'){state.session.interests[p.category]=(state.session.interests[p.category]||0)+(type==='like'?4:1);p.tags.forEach(t=>state.session.interests[t]=(state.session.interests[t]||0)+(type==='like'?.7:.15));if(!state.session.viewed.includes(p.id))state.session.viewed.unshift(p.id);state.session.viewed=state.session.viewed.slice(0,30);saveSession();if(state.backendReady)fetch('/api/lunarist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:{session_id:state.session.id,project_id:p.id,event_type:type,category:p.category,metadata:{tags:p.tags||[]}}})}).catch(()=>{})}
function avatar(m){return `<img class="avatar" src="${m.avatar}" alt="${esc(m.name)}">`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(p,feature=false){const m=member(p.member);return `<article class="card ${feature?'feature':''}" data-project="${p.id}"><div class="thumb"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy"><div class="overlay"><span class="badge">${esc(p.category)}</span></div></div><div class="cardbody"><div class="title">${esc(p.title)}</div><div class="meta artist">${avatar(m)}<span>${esc(m.name)} · ${p.views.toLocaleString()} views</span></div><div class="tags">${p.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}

function serviceCard(s){
  const artistId = s.artist_id || s.owner_id || s.member;
  const m = member(artistId);
  const priceVal = s.amount !== undefined ? Number(s.amount) : parseFloat(s.price_from || 0);
  const titleText = s.label || s.title || 'Commission Service';
  const descText = s.description || s.desc || '';
  const thumb = s.thumbnail_url || m.avatar;

  return `<article class="card" data-service="${s.id}">
    <div class="thumb">
      <img src="${esc(thumb)}" alt="${esc(titleText)}" loading="lazy">
      <div class="overlay"><span class="badge">${esc(s.currency||'USD')} ${priceVal.toFixed(2)}</span></div>
    </div>
    <div class="cardbody">
      <div class="title">${esc(titleText)}</div>
      <div class="meta artist">${avatar(m)}<span>${esc(m.name)}</span></div>
      <div class="meta">${esc(descText)}</div>
      <div style="margin-top:12px">
        <button class="btn primary" style="width:100%" data-inquire-service="${s.id}" data-artist="${m.id}">Inquire & Order</button>
      </div>
    </div>
  </article>`;
}

function services(){
  let list=demo.services||[];
  if(state.query){
    const q=state.query.toLowerCase();
    list=list.filter(s=>( (s.label||s.title||'')+' '+(s.description||'')+' '+member(s.artist_id||s.owner_id||s.member).name ).toLowerCase().includes(q))
  }
  return `<div class="container"><section class="section" style="padding-top:55px"><div class="sectionhead"><div><div class="eyebrow">Hire the collective</div><h2 style="font-size:46px">Services.</h2><p>Book Lunarist members directly for commissions and packages.</p></div><input class="search" id="searchInput" placeholder="Search services, artists…" value="${esc(state.query)}"></div><div class="grid" id="servicesGrid">${list.length?list.map(serviceCard).join(''):'<div class="empty" style="grid-column:1/-1">No services listed yet. Members can add service packages from their dashboard.</div>'}</div></section></div>`
}

function home(){const rec=personalized();const trending=[...demo.projects].sort((a,b)=>b.likes-a.likes);const recent=[...demo.projects].sort((a,b)=>a.created-b.created);return `<div class="container"><section class="hero"><div class="eyebrow">A creative network by Lunarist Studio</div><h1>Unleash<br><em>Your Dream.</em></h1><p>Lunarist is a living portfolio where every artist can publish, every project can be discovered, and every visitor gets a different creative journey.</p><div class="heroactions"><button class="btn primary" data-route="discover">Explore the work</button><button class="btn" data-route="artists">Meet our artists</button></div></section><section class="section"><div class="sectionhead"><div><h2>For you</h2><p>Curated from what you explore.</p></div><span class="eyebrow">Personalized</span></div><div class="grid">${rec.slice(0,5).map((p,i)=>card(p,i===0)).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>Trending this week</h2><p>What the Lunarist community is watching.</p></div><span class="eyebrow">Popular</span></div><div class="grid">${trending.slice(0,4).map(p=>card(p)).join('')}</div></section><section class="section"><div class="split"><div class="panel"><div class="sectionhead"><div><h2>Artists</h2><p>Find the right creative voice.</p></div><button class="btn" data-route="artists">View all</button></div><div class="artistgrid">${demo.members.map(artistCard).join('')}</div></div><div class="panel"><div class="eyebrow">Discovery engine</div><h2 style="font-size:30px;letter-spacing:-.04em">Not everything has to match your taste.</h2><p style="color:var(--muted)">Lunarist mixes relevance with exploration, so your feed can introduce you to artists and disciplines you would not normally click.</p><button class="btn pink" data-action="reset-interest">Reset my feed</button></div></div></section><section class="section"><div class="sectionhead"><div><h2>New arrivals</h2><p>Fresh work from the studio.</p></div></div><div class="grid">${recent.slice(0,4).map(p=>card(p)).join('')}</div></section></div>`}
function artistCard(m){return `<article class="artistcard" data-member="${m.id}">${avatar(m)}<div class="artistname">${esc(m.name)}</div><div class="role">${esc(m.role)}</div><div class="tags">${m.skills.slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div style="margin-top:12px;font-size:11px;color:${m.available?'var(--green)':'var(--muted)'}">${m.available?'● Available':'● Booked'}</div></article>`}

function pathForRoute(route){
  if(route==='discover')return '/discover';
  if(route==='services')return '/services';
  if(route==='artists')return '/artists';
  if(route.startsWith('member:')){const m=member(route.split(':')[1]);return m?'/artist/'+encodeURIComponent(m.username):'/'}
  return '/';
}
function routeFromPath(pathname){
  if(pathname==='/discover')return 'discover';
  if(pathname==='/services')return 'services';
  if(pathname==='/artists')return 'artists';
  const am=pathname.match(/^\/artist\/([^/]+)\/?$/);
  if(am){const uname=decodeURIComponent(am[1]);const m=demo.members.find(x=>x.username===uname);if(m)return 'member:'+m.id}
  return 'home';
}
function projectFromPath(pathname){
  const pm=pathname.match(/^\/project\/([^/]+)\/?$/);
  if(!pm)return null;
  const s=decodeURIComponent(pm[1]);
  return demo.projects.find(x=>x.slug===s||x.id===s)||null;
}

async function uploadToStorage(file,prefix){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
  const path=`${authUser.id}/${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from('media').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}
async function toWebP(file,maxDim=1600,quality=0.85){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){const scale=maxDim/Math.max(width,height);width=Math.round(width*scale);height=Math.round(height*scale)}
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{if(!blob){reject(new Error('WebP conversion failed'));return}resolve(new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'}))},'image/webp',quality);
    };
    img.onerror=()=>reject(new Error('Could not read image'));
    img.src=URL.createObjectURL(file);
  });
}
async function videoFrameThumb(file){
  return new Promise((resolve,reject)=>{
    const video=document.createElement('video');
    video.preload='metadata';video.muted=true;video.playsInline=true;
    video.src=URL.createObjectURL(file);
    video.onloadeddata=()=>{video.currentTime=Math.min(1,(video.duration||2)/2)};
    video.onseeked=()=>{
      const canvas=document.createElement('canvas');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||360;
      canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob=>{if(!blob){reject(new Error('Thumbnail capture failed'));return}resolve(new File([blob],'thumb.webp',{type:'image/webp'}))},'image/webp',0.85);
    };
    video.onerror=()=>reject(new Error('Could not read video'));
  });
}

async function loadCommissionBlock(artistId){
  const el=document.getElementById('commissionBlock');
  if(!el)return;
  const {data:services,error}=await sb.from('services').select('id,key,label,title,description,amount,price_from,currency').or(`artist_id.eq.${artistId},owner_id.eq.${artistId}`);
  const svcs=services&&services.length?services:(demo.services||[]).filter(s=>s.artist_id===artistId||s.owner_id===artistId||s.member===artistId);
  if(!svcs||!svcs.length){el.innerHTML='<div class="eyebrow">Commissions</div><p style="color:var(--muted);font-size:13px">This artist has not listed any commission types yet.</p>';return}
  el.innerHTML=`<div class="eyebrow">Commissions & Services</div>${svcs.map(s=>{
    const price = s.amount !== undefined ? Number(s.amount) : parseFloat(s.price_from || 0);
    return `<div class="listitem"><div class="grow"><b>${esc(s.label||s.title)}</b><div class="meta">${esc(s.description||'')}</div></div><div class="row" style="gap:10px"><b>${esc(s.currency||'USD')} ${price.toFixed(2)}</b><button class="btn primary" data-request-service="${s.id}" data-artist="${artistId}">Inquire & Order</button></div></div>`
  }).join('')}`;
  el.querySelectorAll('[data-request-service]').forEach(btn=>btn.onclick=()=>requestCommission(btn.dataset.requestService,btn.dataset.artist));
}

async function requestCommission(serviceId,artistId){
  if(!authUser){openAuthModal();return}
  let targetArtist = artistId;
  let serviceData = (demo.services||[]).find(s=>s.id===serviceId);
  if(!serviceData){
    const {data:svc}=await sb.from('services').select('id,artist_id,owner_id,amount,price_from,currency').eq('id',serviceId).maybeSingle();
    serviceData = svc;
  }
  if(serviceData){
    targetArtist = serviceData.artist_id || serviceData.owner_id || targetArtist;
  }
  if(!serviceData){
    toast('This commission type is no longer available');
    return;
  }
  const amt = serviceData.amount !== undefined ? Number(serviceData.amount) : parseFloat(serviceData.price_from || 0);
  const {data:commission,error}=await sb.from('commissions').insert({
    service_id:serviceId,
    client_id:authUser.id,
    artist_id:targetArtist,
    amount:amt,
    currency:serviceData.currency||'USD',
    status:'pending_payment'
  }).select('id').single();
  if(error||!commission){
    toast('Could not start this commission: '+(error?.message||'Database error'));
    return;
  }
  const r=await fetch('/api/paypal',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'create',commission_id:commission.id,returnBase:location.origin+location.pathname})
  });
  const body=await r.json();
  if(!r.ok||!body.approveUrl){
    toast(body.error||'Could not start checkout');
    return;
  }
  location.href=body.approveUrl;
}

async function handlePaypalReturn(){
  const params=new URLSearchParams(location.search);
  const paypal=params.get('paypal');
  const commission=params.get('commission');
  if(!paypal||!commission)return;
  if(paypal==='cancel'){toast('Checkout cancelled');history.replaceState({},'',location.pathname);return}
  if(paypal==='return'){
    const token=params.get('token');
    history.replaceState({},'',location.pathname);
    if(!token){toast('Missing PayPal confirmation token');return}
    const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'capture',commission_id:commission,token})});
    const body=await r.json();
    toast(r.ok?'Payment confirmed — commission requested':(body.error||'Payment could not be confirmed'));
  }
}

document.getElementById('accountBtn').onclick=()=>authUser?openDashboard():openAuthModal();document.getElementById('modalClose').onclick=closeModal;document.getElementById('projectModal').onclick=e=>{if(e.target.id==='projectModal')closeModal()};document.getElementById('drawerClose').onclick=closeDash;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDash()};document.getElementById('menuBtn').onclick=()=>document.getElementById('navlinks').classList.toggle('open');
let authMode='signin';
function openAuthModal(){document.getElementById('authError').textContent='';document.getElementById('authModal').classList.add('open')}
function closeAuthModal(){document.getElementById('authModal').classList.remove('open')}
function setAuthMode(m){authMode=m;document.getElementById('authTitle').textContent=m==='signin'?'Sign in':'Create account';document.getElementById('authSubmit').textContent=m==='signin'?'Sign in':'Sign up';document.getElementById('authToggle').textContent=m==='signin'?'Need an account?':'Already have one?'}
document.getElementById('authModalClose').onclick=closeAuthModal;
document.getElementById('authModal').onclick=e=>{if(e.target.id==='authModal')closeAuthModal()};
document.getElementById('authToggle').onclick=()=>setAuthMode(authMode==='signin'?'signup':'signin');
document.getElementById('authSubmit').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const err=document.getElementById('authError');
  err.textContent='';
  if(!email||!password){err.textContent='Enter an email and password.';return}
  const {data,error}=authMode==='signin'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(error){err.textContent=error.message;return}
  if(authMode==='signup'&&!data.session){err.textContent='Check your email to confirm your account, then sign in.';setAuthMode('signin');return}
  closeAuthModal();
  await refreshAuthState();
  openDashboard();
};
async function refreshAuthState(){
  const {data:{session}}=await sb.auth.getSession();
  authUser=session?.user||null;
  if(authUser){
    const {data:p}=await sb.from('profiles').select('id,username,display_name,role,bio,avatar_url,skills,available').eq('id',authUser.id).maybeSingle();
    authProfile=p||null;
  }else{
    authProfile=null;
  }
  updateAccountChip();
}
function updateAccountChip(){
  const nameEl=document.getElementById('accountName');
  const avEl=document.getElementById('accountAvatar');
  if(authUser&&authProfile){
    nameEl.textContent=authProfile.display_name;
    if(authProfile.avatar_url)avEl.outerHTML=`<img class="avatar" id="accountAvatar" src="${authProfile.avatar_url}" alt="">`;
    else avEl.textContent=(authProfile.display_name||'?').slice(0,1).toUpperCase();
  }else{
    nameEl.textContent='Guest';
    avEl.outerHTML='<span class="avatar" id="accountAvatar">G</span>';
  }
}
sb.auth.onAuthStateChange((_event)=>{refreshAuthState()});
refreshAuthState();

async function loadSupabase(){
  try{
    const [pr,pp,sv]=await Promise.all([
      fetch('/api/lunarist?resource=profiles&select=id,username,display_name,role,bio,avatar_url,skills,available&order=created_at').then(r=>r.ok?r.json():Promise.reject()),
      fetch('/api/lunarist?resource=projects&select=id,owner_id,title,description,category,tags,thumbnail_url,media_url,media_type,published,views,likes,created_at&published=eq.true&order=created_at.desc').then(r=>r.ok?r.json():Promise.reject()),
      fetch('/api/lunarist?resource=services').then(r=>r.ok?r.json():Promise.reject())
    ]);
    if(Array.isArray(pr)&&pr.length){demo.members=pr.map(x=>({id:x.id,username:x.username,name:x.display_name,role:x.role||'',bio:x.bio||'',avatar:x.avatar_url||'https://i.pravatar.cc/160?u='+x.id,skills:x.skills||[],available:x.available!==false}));}
    if(Array.isArray(pp)&&pp.length){demo.projects=pp.map(x=>({id:x.id,member:x.owner_id,title:x.title,slug:x.slug||x.id,category:x.category,tags:x.tags||[],views:Number(x.views||0),likes:Number(x.likes||0),created:Date.parse(x.created_at||0)||0,video:x.media_type==='video'?x.media_url:'',image:x.thumbnail_url||x.media_url||'',desc:x.description||''}));}
    if(Array.isArray(sv)&&sv.length){demo.services=sv.map(x=>({id:x.id,artist_id:x.artist_id||x.owner_id,owner_id:x.owner_id||x.artist_id,key:x.key,label:x.label||x.title,title:x.title||x.label,description:x.description||'',amount:x.amount !== undefined ? x.amount : parseFloat(x.price_from || 0),price_from:x.price_from,currency:x.currency||'USD',thumbnail_url:x.thumbnail_url}));}
    state.backendReady=true;
  }catch(e){console.warn('Supabase service endpoint unavailable; using local state.',e)}
}

loadSupabase().finally(()=>{
  state.route=routeFromPath(location.pathname);
  render();
  const proj=projectFromPath(location.pathname);
  if(proj)openProject(proj.id,{skipPush:true});
});
handlePaypalReturn();
window.addEventListener('popstate',()=>{
  state.route=routeFromPath(location.pathname);
  render();
  const proj=projectFromPath(location.pathname);
  if(proj)openProject(proj.id,{skipPush:true});else closeModalSilently();
});
