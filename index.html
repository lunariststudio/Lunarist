.card,.panel,.artistcard{will-change:transform}.panel:hover{border-color:rgba(201,182,255,.18);box-shadow:0 18px 55px rgba(0,0,0,.18)}
.modal{opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}.modal.open{opacity:1;visibility:visible}.modalbox{transform:translateY(16px) scale(.985);opacity:0;transition:transform .45s var(--ease),opacity .35s var(--ease)}.modal.open .modalbox{transform:none;opacity:1}
.drawer{opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}.drawer.open{opacity:1;visibility:visible}.drawerpanel{transform:translateX(28px);transition:transform .45s var(--ease)}.drawer.open .drawerpanel{transform:none}
.toast{transition:opacity .3s var(--ease),transform .4s var(--ease)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s var(--ease),transform .65s var(--ease)}.reveal.in-view{opacity:1;transform:none}
::selection{background:rgba(255,134,200,.3);color:#fff}
@media(max-width:720px){.navin{gap:8px}.nav-tools{margin-left:auto}.userchip{max-width:140px}.userchip span:last-child{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lang-switch{padding:6px 8px}.navlinks.open{box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(18px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app" id="app">
<header class="nav"><div class="navin"><button class="brand" data-route="home">LUNARIST <span>✦</span></button><nav class="navlinks" id="navlinks"><button class="navbtn active" data-route="home" data-i18n="home">Home</button><button class="navbtn" data-route="discover" data-i18n="discover">Discover</button><button class="navbtn" data-route="services" data-i18n="services">Services</button><button class="navbtn" data-route="artists" data-i18n="artists">Artists</button><button class="navbtn nav-commission" id="navCommissionsBtn" data-i18n="myCommissions">My Commissions</button><button class="navbtn" data-route="admin" id="navAdminBtn" style="display:none" data-i18n="adminStudio">Admin Studio</button></nav><div class="nav-tools"><button class="lang-switch" id="langSwitch" aria-label="Language"><span data-lang="en" class="active">EN</span><span class="sep">|</span><span data-lang="ja">JP</span></button></div><button class="notif-btn" id="notifToggleBtn" style="display:none">🔔 <span id="notifBadgeCount" class="notif-badge" style="display:none">0</span></button><button class="navbtn mobile" id="menuBtn">Menu</button><button class="userchip" id="accountBtn"><span class="avatar" id="accountAvatar">G</span><span id="accountName">Guest</span></button></div></header>
<div class="notif-popover" id="notifPopover"><div class="notif-header"><b style="font-size:13px">Notifications</b><button id="markNotifsReadBtn" style="background:none;border:none;color:var(--moon);font-size:11px;cursor:pointer">Mark all read</button></div><div class="notif-list" id="notifList"></div></div>
<main id="view"></main>
<footer class="footer"><div class="container row"><div class="grow"><strong>LUNARIST STUDIO</strong><br><span>Unleash Your Dream.</span></div><span>Creative network · 2026</span></div></footer>
</div>
<div class="modal" id="projectModal"><div class="modalbox"><button class="modalclose" id="modalClose">×</button><div class="modalmedia" id="modalMedia"></div><div class="modalcontent" id="modalContent"></div></div></div>
<div class="drawer" id="drawer"><aside class="drawerpanel"><div class="dashhead"><div><div class="eyebrow" data-i18n="memberSpace">Member space</div><h2 id="dashTitle" style="margin:4px 0">Your Lunarist</h2></div><button class="iconbtn" id="drawerClose">×</button></div><div class="dashnav"><button class="filter active" data-dash="overview" data-i18n="overview">Overview</button><button class="filter" data-dash="messages" data-i18n="messages">Messages 💬</button><button class="filter" data-dash="commissions" data-i18n="myCommissions">My Commissions</button><button class="filter" data-dash="projects" data-i18n="projects">My Projects</button><button class="filter" data-dash="profile" data-i18n="profile">Profile</button><button class="filter" data-dash="services" data-i18n="servicesTab">Services</button></div><section class="dashsection active" id="dash-overview"></section><section class="dashsection" id="dash-messages"></section><section class="dashsection" id="dash-commissions"></section><section class="dashsection" id="dash-projects"></section><section class="dashsection" id="dash-services"></section><section class="dashsection" id="dash-profile"></section></aside></div>
<div class="toast" id="toast"></div>
<div class="modal" id="authModal"><div class="modalbox" style="max-width:520px;padding:26px"><button class="modalclose" id="authClose">×</button><div class="eyebrow">Lunarist account</div><h2 id="authTitle" style="font-size:34px;margin:6px 0 8px">Sign in</h2><p id="authSubtitle" style="color:var(--muted)">Save work, publish projects and manage your creative profile.</p><div class="formgrid" style="margin-top:18px"><div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field full"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="field full" id="authUsernameWrap" style="display:none"><label>Username</label><input id="authUsername" autocomplete="username" placeholder="yourname"></div><div class="field full" id="authDisplayWrap" style="display:none"><label>Display name</label><input id="authDisplay" placeholder="Your name"></div><div class="field full" id="authInviteWrap" style="display:none"><label>Member invitation code</label><input id="authInvite" autocomplete="one-time-code" placeholder="Paste your one-time invitation code"><div class="meta" style="margin-top:6px">Invitation codes can only be redeemed once.</div></div></div><div class="heroactions" style="margin-top:18px"><button class="btn primary" id="authSubmit">Sign in</button><button class="btn" id="authToggle">Create account</button></div><div style="margin-top:10px"><button class="btn" id="googleAuth" style="width:100%">Continue with Google</button></div><div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn" id="forgotPassword" style="padding:0;background:none;border:0">Forgot password?</button><span id="authModeHint" class="meta"></span></div><p id="authMessage" style="min-height:20px;margin:12px 0 0;color:var(--muted)"></p></div></div>
<style>
.lunarist-direct-badge{background:linear-gradient(135deg,rgba(255,112,196,.22),rgba(201,182,255,.2));border:1px solid rgba(255,150,218,.55);color:#ffd5f1;box-shadow:0 6px 20px rgba(255,112,196,.12);font-weight:800;letter-spacing:.02em}
.thumb .overlay{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.lunarist-direct-label{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:#ffc9ea;font-size:11px;font-weight:800;letter-spacing:.02em}
</style>
<script>
// Global Error Boundary & Graceful Handling
window.addEventListener('error', (e) => {
  console.error('[Lunarist Error Handler]', e.error || e.message);
  if(typeof toast === 'function') toast('Something went wrong. Please try again.');
});

let supabaseClient=null;
const state={route:'home',filter:'All',query:'',session:{id:'s_'+Math.random().toString(36).slice(2),interests:{},viewed:[],liked:[]},currentUser:null,currentMember:null,selectedTheme:'moonlight',backendReady:false,authMode:'signin',loadError:null,conversations:[],activeConversation:null,notifications:[],myCommissions:[],myCommissionError:null,myReviews:[]};
const data={members:[],projects:[],services:[],recommendations:[]};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function updateSeoMeta(title, desc, image) {
  const pageTitle = title ? `${title} — Lunarist Studio` : 'Lunarist Studio — Unleash Your Dream';
  document.title = pageTitle;
  const ogT = document.getElementById('ogTitle'); if(ogT) ogT.content = pageTitle;
  const ogD = document.getElementById('ogDesc'); if(ogD) ogD.content = desc || 'A living creative network where artists share work and clients discover talent.';
  const ogI = document.getElementById('ogImage'); if(ogI && image) ogI.content = image;
}

function handleImageError(img) { img.onerror=null; img.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80'; }
function formatDescription(text){if(!text)return '';const escaped=esc(text);const formatted=escaped.replace(/(?:^|\n)[-*\u2022]\s+(.+)/g,'<div class="bullet-item"><span class="bullet-dot">•</span><span>$1</span></div>');return formatted.replace(/\n/g,'<br>')}
function formatViews(n){n=Number(n||0);if(n>=1000000)return(n/1000000).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return n.toLocaleString()}
function applyTheme(themeName){state.selectedTheme=themeName||'moonlight';document.documentElement.setAttribute('data-theme',state.selectedTheme)}
function getSession(){let s=null;try{s=JSON.parse(localStorage.getItem('lunarist_session')||'null')}catch(e){}if(!s||typeof s!=='object')s={};s.id=typeof s.id==='string'&&s.id?s.id:'s_'+Math.random().toString(36).slice(2);s.interests=s.interests&&typeof s.interests==='object'?s.interests:{};s.viewed=Array.isArray(s.viewed)?s.viewed:[];s.liked=Array.isArray(s.liked)?s.liked:[];localStorage.setItem('lunarist_session',JSON.stringify(s));return s}
state.session=getSession();function saveSession(){localStorage.setItem('lunarist_session',JSON.stringify(state.session))}
function member(id){return data.members.find(m=>m.id===id)||null}function roleLabel(m){if(!m)return'Guest';if(m.is_admin)return'Administrator';return m.account_type==='member'?'Lunarist Member':'User'}function memberByUsername(u){u=String(u||'').toLowerCase();return data.members.find(m=>(m.username||'').toLowerCase()===u)||null}
const RESERVED_ROUTES=['discover','artists','services','commissions','admin','api'];
function pathForRoute(route){if(route==='home')return'/';if(route==='discover')return'/discover';if(route==='artists')return'/artists';if(route==='services')return'/services';if(route==='commissions')return'/commissions';if(route==='admin')return'/admin';if(route.startsWith('member:')){const m=member(route.split(':')[1]);return m?.username?('/'+m.username):'/artists'}return'/'}
function goRoute(route,replace){state.route=route;const path=pathForRoute(route);if(location.pathname!==path){history[replace?'replaceState':'pushState']({route},'',path)}render()}
function routeFromPath(){const seg=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));if(!seg)return'home';if(seg==='discover')return'discover';if(seg==='artists')return'artists';if(seg==='services')return'services';if(seg==='commissions')return'commissions';if(seg==='admin')return'admin';if(RESERVED_ROUTES.includes(seg.toLowerCase()))return'home';const m=memberByUsername(seg);return m?'member:'+m.id:'home'}
window.addEventListener('popstate',()=>{state.route=routeFromPath();render()});
function avatar(m){return`<img class="avatar" src="${esc(m?.avatar||'https://i.pravatar.cc/160?u=unknown')}" alt="${esc(m?.name||'Artist')}" loading="lazy" onerror="handleImageError(this)">`}
function emptyState(title='Nothing here yet.',text='Lunarist is waiting for its next creative signal.'){return`<div class="empty" style="grid-column:1/-1"><strong style="color:var(--text);display:block;margin-bottom:6px">${esc(title)}</strong>${esc(text)}</div>`}
function card(p,feature=false){const m=member(p.member);const directBadge=p.lunarist_direct?`<span class="badge lunarist-direct-badge">✦ Lunarist Studio Commission</span>`:'';return`<article class="card ${feature?'feature':''}" data-project="${p.id}"><div class="thumb"><img src="${esc(p.image||'')}" alt="${esc(p.title)}" loading="lazy" onerror="handleImageError(this)"><div class="overlay"><span class="badge">${esc(p.category)}</span>${directBadge}</div></div><div class="cardbody"><div class="title">${esc(p.title)}</div><div class="meta artist">${avatar(m)}<span>${esc(m?.name||'Unknown artist')} · ${formatViews(p.views)} views</span></div>${p.lunarist_direct?`<div class="lunarist-direct-label">✦ Purchased through Lunarist Studio</div>`:''}<div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function serviceCard(s){const m=member(s.member);return`<article class="card" data-service="${s.id}"><div class="thumb"><img src="${esc(s.thumbnail_url||'')}" alt="${esc(s.title)}" loading="lazy" onerror="handleImageError(this)"><div class="overlay"><span class="badge">${esc(s.category)}</span></div></div><div class="cardbody"><div class="title">${esc(s.title)}</div><div class="meta artist">${avatar(m)}<span>${esc(m?.name||'Unknown artist')}</span></div><div class="meta">${[s.price_from?('From '+esc(s.price_from)):'',esc(s.delivery_time||'')].filter(Boolean).join(' · ')}</div><div class="tags">${(s.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function home(){return`<div class="container"><section class="hero"><div class="eyebrow">A creative network by Lunarist Studio</div><h1>Unleash<br><em>Your Dream.</em></h1><p>Lunarist is a living portfolio where every artist can publish, every project can be discovered, and every visitor gets a different creative journey.</p><div class="heroactions"><button class="btn primary" data-route="discover">Explore the work</button><button class="btn" data-route="artists">Meet our artists</button></div></section><section class="section"><div class="sectionhead"><div><h2>For you</h2><p>Curated from what you explore.</p></div><span class="eyebrow">Personalized</span></div><div class="grid">${data.projects.length?data.projects.slice(0,5).map((p,i)=>card(p,i===0)).join(''):emptyState('No published work yet.','Create the first Lunarist project from your member space.')}</div></section></div>`}
function discover(){let list=data.projects;if(state.query){const q=state.query.toLowerCase();list=list.filter(p=>(p.title+' '+p.category+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q))}return`<div class="container"><section class="section" style="padding-top:55px"><div class="sectionhead"><div><div class="eyebrow">Explore Lunarist</div><h2 style="font-size:46px">Discover work.</h2></div><input class="search" id="searchInput" placeholder="Search projects, artists, skills…" value="${esc(state.query)}"></div><div class="grid">${list.length?list.map(p=>card(p)).join(''):emptyState('No work found.','Try another search.')}</div></section></div>`}
function artists(){return`<div class="container"><section class="section" style="padding-top:55px"><div class="eyebrow">The Lunarist collective</div><h2 style="font-size:52px;letter-spacing:-.05em;margin:10px 0">Meet the artists.</h2><div class="artistgrid" style="margin-top:28px">${data.members.length?data.members.map(m=>`<article class="artistcard" data-member="${m.id}">${avatar(m)}<div class="artistname">${esc(m.name)}</div><div class="role">${esc(m.role)}</div></article>`).join(''):emptyState('No public artist profiles yet.')}</div></section></div>`}
function services(){return`<div class="container"><section class="section" style="padding-top:55px"><div class="eyebrow">Hire the collective</div><h2 style="font-size:46px">Services.</h2><div class="grid">${data.services.length?data.services.map(serviceCard).join(''):emptyState('No services listed yet.')}</div></section></div>`}

function render(){document.querySelectorAll('.navbtn[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));let html=state.route==='home'?home():state.route==='discover'?discover():state.route==='services'?services():state.route==='artists'?artists():state.route==='admin'?`<div class="container"><section class="section" style="padding-top:55px" id="adminPageView"></section></div>`:home();document.getElementById('view').innerHTML=html;bind();if(state.route==='admin')renderAdminStudioPage();applyLanguage?.(state.language||localStorage.getItem('lunarist_lang')||'en')}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>goRoute(b.dataset.route));document.querySelectorAll('[data-project]').forEach(c=>c.onclick=()=>openProject(c.dataset.project));document.querySelectorAll('[data-service]').forEach(c=>c.onclick=()=>openService(c.dataset.service));document.querySelectorAll('[data-member]').forEach(c=>c.onclick=()=>goRoute('member:'+c.dataset.member));const s=document.getElementById('searchInput');if(s)s.oninput=e=>{state.query=e.target.value;render()}}
function openProject(id){const p=data.projects.find(x=>x.id===id);if(!p)return;document.getElementById('modalMedia').innerHTML=`<img src="${esc(p.image||'')}" style="width:100%;height:100%;object-fit:cover" onerror="handleImageError(this)">`;document.getElementById('modalContent').innerHTML=`<div class="eyebrow">${esc(p.category)}</div><h2>${esc(p.title)}</h2><p>${formatDescription(p.desc||p.description||'')}</p>`;document.getElementById('projectModal').classList.add('open')}
function openService(id){const s=data.services.find(x=>x.id===id);if(!s)return;document.getElementById('modalMedia').innerHTML=`<img src="${esc(s.thumbnail_url||'')}" style="width:100%;height:100%;object-fit:cover" onerror="handleImageError(this)">`;document.getElementById('modalContent').innerHTML=`<div class="eyebrow">${esc(s.category)}</div><h2>${esc(s.title)}</h2><p>${formatDescription(s.description||'')}</p>`;document.getElementById('projectModal').classList.add('open')}
function closeModal(){document.getElementById('projectModal').classList.remove('open')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}

function openAuth(mode='signin'){state.authMode=mode;const m=mode==='signup';const invite=state.inviteCode||localStorage.getItem('lunarist_pending_invite')||'';document.getElementById('authTitle').textContent=m?'Create your Lunarist account':'Sign in';document.getElementById('authSubtitle').textContent=m?(invite?'You were invited to join Lunarist as a Member.':'Member accounts require a one-time invitation.'):'Save work, publish projects and manage your creative profile.';document.getElementById('authSubmit').textContent=m?'Create account':'Sign in';document.getElementById('authToggle').textContent=m?'I already have an account':'Create account';document.getElementById('authUsernameWrap').style.display=m?'flex':'none';document.getElementById('authDisplayWrap').style.display=m?'flex':'none';document.getElementById('authInviteWrap').style.display=m?'flex':'none';document.getElementById('authInvite').value=invite;document.getElementById('forgotPassword').style.display=m?'none':'inline-flex';document.getElementById('authModeHint').textContent=m?(invite?'One-time invitation detected.':'Open a valid invitation link first.'):'Use Google or email/password';document.getElementById('authMessage').textContent='';document.getElementById('authModal').classList.add('open');const google=document.getElementById('googleAuth');google.textContent=m?'Continue with Google (invitation required)':'Continue with Google'}
function closeAuth(){document.getElementById('authModal').classList.remove('open')}
async function reserveInvitation(code,email){code=String(code||'').trim().toUpperCase();email=String(email||'').trim().toLowerCase();const nonce=crypto.randomUUID().replace(/-/g,'')+Math.random().toString(36).slice(2,10);const r=await fetch('/api/invitations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reserve',code,email,nonce})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to reserve invitation.');localStorage.setItem('lunarist_invite_reservation',JSON.stringify({code,email,nonce,at:Date.now()}));localStorage.setItem('lunarist_pending_invite',code);state.inviteCode=code;return d}
function pendingInvitationReservation(){try{const r=JSON.parse(localStorage.getItem('lunarist_invite_reservation')||'null');if(r&&r.code&&r.email&&r.nonce)return r}catch{}return null}
async function redeemInvitation(code,nonce){const r=await fetch('/api/invitations',{method:'POST',headers:await apiAuthHeaders(),body:JSON.stringify({action:'redeem',code:String(code||'').trim().toUpperCase(),nonce:nonce||pendingInvitationReservation()?.nonce||''})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Invitation could not be redeemed.');localStorage.removeItem('lunarist_pending_invite');localStorage.removeItem('lunarist_invite_reservation');state.inviteCode='';return true}
async function redeemPendingInvitation(){if(!state.currentUser)return;const r=pendingInvitationReservation();const code=state.inviteCode||localStorage.getItem('lunarist_pending_invite');if(!code)return;try{await redeemInvitation(code,r?.nonce)}catch(e){localStorage.removeItem('lunarist_pending_invite');localStorage.removeItem('lunarist_invite_reservation');state.inviteCode=''}}
async function authSubmit(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,username=document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,32),display=document.getElementById('authDisplay').value.trim(),invite=document.getElementById('authInvite').value.trim().toUpperCase();if(!email||!password||(state.authMode==='signup'&&!username)){document.getElementById('authMessage').textContent='Please complete the required fields.';return}document.getElementById('authSubmit').disabled=true;try{if(state.authMode==='signup'){if(!invite||!/^[A-Z0-9]{8,32}$/.test(invite))throw new Error('A valid one-time invitation code is required to create a Member account.');await reserveInvitation(invite,email);const {data:d,error}=await supabaseClient.auth.signUp({email,password,options:{data:{username,display_name:display||username,invite_code:invite}}});if(error)throw error;document.getElementById('authMessage').textContent=d.session?'Account created.':'Check your email to confirm your account.';if(d.session){await redeemInvitation(invite,pendingInvitationReservation()?.nonce);closeAuth();await refreshUser();openDashboard()}}else{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;closeAuth();await refreshUser();openDashboard()}}catch(e){document.getElementById('authMessage').textContent=e.message||'Authentication failed.'}finally{document.getElementById('authSubmit').disabled=false}}
async function signInWithGoogle(){const btn=document.getElementById('googleAuth');btn.disabled=true;try{if(state.authMode==='signup'){const email=document.getElementById('authEmail').value.trim();const invite=document.getElementById('authInvite').value.trim().toUpperCase();if(!email)throw new Error('Enter the Google account email first so the invitation can be reserved to it.');if(!invite)throw new Error('A valid one-time invitation code is required for Google signup.');const reservation=await reserveInvitation(invite,email);const redirect=window.location.origin+'/?oauth=google&invite='+encodeURIComponent(invite)+'&nonce='+encodeURIComponent(reservation.nonce);const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirect}});if(error)throw error}else{const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/'}});if(error)throw error}}catch(e){document.getElementById('authMessage').textContent=e.message||'Google sign-in failed.';btn.disabled=false}}
async function resetPassword(){const email=document.getElementById('authEmail').value.trim();if(!email){document.getElementById('authMessage').textContent='Enter your email first.';return}const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/?reset=1'});if(error)document.getElementById('authMessage').textContent=error.message;else document.getElementById('authMessage').textContent='Password reset email sent.'}

async function apiAuthHeaders(){const {data:{session}}=await supabaseClient.auth.getSession();return session?.access_token?{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
async function refreshUser(){const {data:{session}}=await supabaseClient.auth.getSession();state.currentUser=session?.user||null;if(state.currentUser){const {data:p}=await supabaseClient.from('profiles').select('id,username,display_name,role,bio,avatar_url,skills,available,is_admin,account_type,tos,tos_ja,theme').eq('id',state.currentUser.id).maybeSingle();const isAdmin=!!p?.is_admin||state.currentUser.email==='lunariststudio@gmail.com';state.currentMember=p?{id:p.id,username:p.username,name:p.display_name,role:p.role||'',bio:p.bio||'',tos:p.tos||'',theme:p.theme||'moonlight',avatar:p.avatar_url||'https://i.pravatar.cc/160?u='+p.id,skills:p.skills||[],available:p.available!==false,is_admin:isAdmin,account_type:isAdmin?'member':(p.account_type||'user')}:null;document.getElementById('accountName').textContent=state.currentMember?.name||'Member';const navAdmin=document.getElementById('navAdminBtn');if(navAdmin)navAdmin.style.display=state.currentMember?.is_admin?'inline-flex':'none'}else{state.currentMember=null;document.getElementById('accountName').textContent='Guest';const navAdmin=document.getElementById('navAdminBtn');if(navAdmin)navAdmin.style.display='none'}}

async function loadData(){try{const cfg=await fetch('/api/config').then(r=>r.json());supabaseClient=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);state.backendReady=true;const [{data:members},{data:projects},{data:services}]=await Promise.all([supabaseClient.from('profiles').select('*').limit(200),supabaseClient.from('projects').select('*').eq('published',true).limit(200),supabaseClient.from('services').select('*').eq('published',true).limit(200)]);data.members=(members||[]).map(p=>({id:p.id,username:p.username,name:p.display_name,role:p.role||'',bio:p.bio||'',avatar:p.avatar_url,skills:p.skills||[],available:p.available!==false,is_admin:p.is_admin,account_type:p.account_type,tos:p.tos,theme:p.theme}));data.projects=projects||[];data.services=services||[];await refreshUser()}catch(e){state.loadError=e.message||'Database unavailable'}}

async function renderAdminStudioPage(activeTab='members'){
  if(!state.currentUser||!state.currentMember?.is_admin){document.getElementById('adminPageView').innerHTML='<div class="panel"><h3>Access Restricted</h3><p style="color:var(--muted)">You must be an administrator to view this page.</p></div>';return}
  const sec=document.getElementById('adminPageView');
  sec.innerHTML=`<div class="panel"><div class="eyebrow">Studio Admin</div><h2 style="margin:4px 0 14px">Admin Studio</h2><div class="discoverbar"><button class="filter ${activeTab==='members'?'active':''}" data-studio-tab="members">Members</button><button class="filter ${activeTab==='invitations'?'active':''}" data-studio-tab="invitations">Invitations</button><button class="filter ${activeTab==='analytics'?'active':''}" data-studio-tab="analytics">Analytics</button><button class="filter ${activeTab==='settings'?'active':''}" data-studio-tab="settings">Settings</button></div><div data-studio-panel="members" style="${activeTab==='members'?'':'display:none'}"><div class="meta">Member management</div></div><div data-studio-panel="invitations" style="${activeTab==='invitations'?'':'display:none'}"><div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap"><div class="grow"><div class="eyebrow">Member Invitations</div><h3 style="margin:4px 0">One-time member access</h3><p class="meta">Create an invitation link or code. Each invitation can be redeemed once and then becomes invalid.</p></div><button class="btn primary" id="createMemberInvite">+ Create invitation</button></div><div id="inviteCreateResult" style="margin-top:14px"></div><div id="memberInviteList" style="margin-top:16px"><div class="meta">Loading invitations…</div></div></div><div data-studio-panel="analytics" style="${activeTab==='analytics'?'':'display:none'}"><div class="meta">Analytics</div></div><div data-studio-panel="settings" style="${activeTab==='settings'?'':'display:none'}"><div class="meta">Studio settings</div></div></div>`;
  sec.querySelectorAll('[data-studio-tab]').forEach(btn=>btn.onclick=()=>renderAdminStudioPage(btn.dataset.studioTab));
  await loadAdminInvitations(sec);
}
async function loadAdminInvitations(sec){const list=sec.querySelector('#memberInviteList'),create=sec.querySelector('#createMemberInvite'),result=sec.querySelector('#inviteCreateResult');if(!list||!create)return;const renderRows=rows=>{if(!rows?.length){list.innerHTML='<div class="meta">No invitations yet.</div>';return}list.innerHTML=rows.map(inv=>{const used=!!inv.used_at,expired=!!inv.expires_at&&new Date(inv.expires_at)<=new Date()&&!used,link=location.origin+'/?invite='+encodeURIComponent(inv.code);return`<div class="listitem"><div class="grow"><b style="font-family:IBM Plex Mono,monospace;letter-spacing:.08em">${esc(inv.code)}</b><div class="meta">${used?'Used':expired?'Expired':'Available'} · created ${new Date(inv.created_at).toLocaleString()} · ${inv.expires_at?'expires '+new Date(inv.expires_at).toLocaleString():'no expiry'}</div></div><div class="row"><button class="btn" data-copy-invite="${esc(link)}" ${used||expired?'disabled':''}>Copy link</button>${!used&&!expired?`<button class="btn" data-revoke-invite="${esc(inv.id)}">Revoke</button>`:''}</div></div>`}).join('');list.querySelectorAll('[data-copy-invite]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copyInvite).then(()=>toast('Invitation link copied')));list.querySelectorAll('[data-revoke-invite]').forEach(b=>b.onclick=async()=>{if(!confirm('Revoke this invitation?'))return;const r=await fetch('/api/invitations',{method:'POST',headers:await apiAuthHeaders(),body:JSON.stringify({action:'revoke',id:b.dataset.revokeInvite})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to revoke');toast('Invitation revoked');loadAdminInvitations(sec)})};create.onclick=async()=>{create.disabled=true;try{const r=await fetch('/api/invitations',{method:'POST',headers:await apiAuthHeaders(),body:JSON.stringify({action:'create',expires_days:30})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to create invitation');const link=location.origin+'/?invite='+encodeURIComponent(d.code);result.innerHTML=`<div class="panel" style="margin:0"><div class="eyebrow">New one-time invitation</div><div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><input value="${esc(d.code)}" readonly style="max-width:180px;font-family:IBM Plex Mono,monospace"><button class="btn" id="copyNewInvite">Copy code</button><button class="btn primary" id="copyNewInviteLink">Copy invitation link</button></div><div class="meta" style="margin-top:8px">${esc(link)}</div></div>`;document.getElementById('copyNewInvite').onclick=()=>navigator.clipboard.writeText(d.code).then(()=>toast('Code copied'));document.getElementById('copyNewInviteLink').onclick=()=>navigator.clipboard.writeText(link).then(()=>toast('Invitation link copied'));await loadAdminInvitations(sec)}catch(e){toast(e.message||'Unable to create invitation')}finally{create.disabled=false}};try{const r=await fetch('/api/invitations?action=list',{headers:await apiAuthHeaders()});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load invitations');renderRows(Array.isArray(d)?d:[])}catch(e){list.innerHTML='<div class="meta">'+esc(e.message||'Unable to load invitations.')+'</div>'}}

// Keep the rest of the existing application bootstrap and event wiring.
document.getElementById('modalClose').onclick=closeModal;document.getElementById('authClose').onclick=closeAuth;document.getElementById('authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth()};document.getElementById('authSubmit').onclick=authSubmit;document.getElementById('authToggle').onclick=()=>openAuth(state.authMode==='signin'?'signup':'signin');document.getElementById('googleAuth').onclick=signInWithGoogle;document.getElementById('forgotPassword').onclick=resetPassword;document.getElementById('accountBtn').onclick=()=>state.currentUser?openAuth('signin'):openAuth('signin');document.getElementById('navCommissionsBtn').onclick=()=>toast('My Commissions');document.getElementById('menuBtn').onclick=()=>document.getElementById('navlinks').classList.toggle('open');
(async()=>{const params=new URLSearchParams(location.search);state.inviteCode=(params.get('invite')||'').trim().toUpperCase();const nonce=(params.get('nonce')||'').trim();if(state.inviteCode)localStorage.setItem('lunarist_pending_invite',state.inviteCode);if(state.inviteCode&&nonce){const old=pendingInvitationReservation();localStorage.setItem('lunarist_invite_reservation',JSON.stringify({code:state.inviteCode,nonce,email:old?.email||'',at:Date.now()}))}await loadData();render();await redeemPendingInvitation();if(state.inviteCode&&!state.currentUser)openAuth('signup')})();
</script>
</body>
</html>
