name: Fix logged-in invitation flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch invitation redemption flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function redeemPendingInvitation(){
            if(!state.currentUser)return;
            const r=pendingInvitationReservation(); const code=state.inviteCode||localStorage.getItem('lunarist_pending_invite'); if(!code)return;
            try{await redeemInvitation(code,r?.nonce);await refreshUser();toast('Welcome to Lunarist — your Member invitation is active.')}catch(e){
              if(!/already used|invalid|expired|only be used when creating/i.test(e.message||''))toast(e.message||'Invitation could not be redeemed.');
              localStorage.removeItem('lunarist_pending_invite');localStorage.removeItem('lunarist_invite_reservation');state.inviteCode='';
            }
          }"""
          new="""async function redeemPendingInvitation(){
            if(!state.currentUser)return;
            const code=state.inviteCode||localStorage.getItem('lunarist_pending_invite'); if(!code)return;
            try{
              let r=pendingInvitationReservation();
              const currentEmail=String(state.currentUser.email||'').trim().toLowerCase();
              if(!currentEmail)throw new Error('Your account does not have an email address available for this invitation.');
              if(!r || r.code!==String(code).trim().toUpperCase() || String(r.email||'').toLowerCase()!==currentEmail){
                r=await reserveInvitation(code,currentEmail);
              }
              await redeemInvitation(code,r?.nonce);await refreshUser();toast('Welcome to Lunarist — your Member invitation is active.');
              if(document.getElementById('authModal')?.classList.contains('open'))closeAuth();
              if(state.currentMember?.account_type==='member')openDashboard();
            }catch(e){
              if(!/already used|invalid|expired|different email|reservation/i.test(e.message||''))toast(e.message||'Invitation could not be redeemed.');
              localStorage.removeItem('lunarist_pending_invite');localStorage.removeItem('lunarist_invite_reservation');state.inviteCode='';
            }
          }"""
          if old not in s:
              raise SystemExit('expected invitation function not found; refusing to modify index.html')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patched HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix logged-in member invitation redemption"
          git push
