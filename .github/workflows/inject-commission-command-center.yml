name: Inject commission command center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[commission-lcc]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject commission command center
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/commission-command-center.js?v=1"></script>'
          if marker not in s:
              needle = '</body>'
              if needle not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace(needle, marker + '\n' + needle, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'lunariststudio-bot'
          git config user.email '41898282+lunariststudio[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: inject commission command center [commission-lcc]'
          git push
