name: Fix Admin Member Toggle Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'fix: send admin session token')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin Studio member toggle auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ action: 'toggle-member', targetId: id, nextType: next })"
          new = "headers: await apiAuthHeaders(),\n        body: JSON.stringify({ action: 'toggle-member', targetId: id, nextType: next })"
          if old not in s:
              raise SystemExit('target admin toggle fetch block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patched HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: send admin session token for member promotion'
          git push
