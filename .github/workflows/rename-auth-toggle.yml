name: Rename Lunarist registration button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'id="authToggle">Create account'
          new = 'id="authToggle">Lunarist Member Register'
          if old not in s:
              raise SystemExit('Target button text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rename Create Account to Lunarist Member Register"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/rename-auth-toggle.yml
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary rename workflow"
          git push
