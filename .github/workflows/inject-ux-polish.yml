name: Inject Lunarist UX polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject UX assets into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- LUNARIST_UX_POLISH -->'
          if marker not in s:
              injection = '''\n<!-- LUNARIST_UX_POLISH -->\n<link rel="stylesheet" href="/ux-enhancements.css">\n<script src="/ux-enhancements.js" defer></script>\n'''
              if '</head>' not in s:
                  raise SystemExit('index.html has no </head>')
              s = s.replace('</head>', injection + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish Lunarist UI motion and hover interactions"
          git push
