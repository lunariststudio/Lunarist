name: Inject profile sync hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[profile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject profile sync script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/profile-sync.js"></script>'
          if marker not in s:
              needle = '</body>'
              if needle not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace(needle, marker + '\n' + needle, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'lunariststudio-bot'
          git config user.email '41898282+lunariststudio[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: authenticated profile sync [profile-sync]'
          git push
