name: Inject Lunarist client/profile scripts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[lunarist-inject]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject required frontend enhancement scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '<script src="/profile-sync.js"></script>',
              '<script src="/lunarist-enhancements.js?v=2"></script>',
              '<script src="/client-hub.js?v=20261017-1"></script>',
              '<script src="/client-messaging.js?v=20261007-contrast3"></script>',
              '<script src="/social-links.js?v=1"></script>',
              '<script src="/commission-command-center.js?v=1"></script>',
              '<script src="/commission-payment-state.js?v=1"></script>',
              '<script src="/public-member-profile.js?v=1"></script>',
              '<script src="/eugene-lunarist-integration.js?v=1"></script>',
              '<script src="/client-hub-eugene-card-tab.js"></script>',
              '<script src="/oauth-browser-bridge.js?v=2"></script>',
          ]
          for marker in markers:
              if marker not in s:
                  needle = '</body>'
                  if needle not in s:
                      raise SystemExit('index.html has no closing body tag')
                  s = s.replace(needle, marker + '\n' + needle, 1)
          s = s.replace('<script src="/lunarist-enhancements.js?v=1"></script>','')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'lunariststudio-bot'
          git config user.email '41898282+lunaristudio[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: inject Eugene Card integration [lunarist-inject]'
          git push
