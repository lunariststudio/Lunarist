name: Inject Lunarist client/profile scripts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[lunarist-inject]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject required frontend enhancement scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '<script src="/profile-sync.js"></script>',
              '<script src="/lunarist-enhancements.js?v=2"></script>',
              '<script src="/client-space.js?v=2"></script>',
              '<script src="/client-space-ui.js?v=2"></script>',
              '<script src="/social-links.js?v=1"></script>',
              '<script src="/commission-command-center.js?v=1"></script>',
              '<script src="/commission-filters.js?v=1"></script>',
          ]
          for marker in markers:
              if marker not in s:
                  needle = '</body>'
                  if needle not in s:
                      raise SystemExit('index.html has no closing body tag')
                  s = s.replace(needle, marker + '\n' + needle, 1)
          s = s.replace('<script src="/lunarist-enhancements.js?v=1"></script>','')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'lunariststudio-bot'
          git config user.email '41898282+lunariststudio[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: inject commission filters [lunarist-inject]'
          git push
